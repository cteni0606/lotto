<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="로또 분석기">
<title>🎱 로또 분석기 v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;background:#07071a;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#07071a 0%,#0d0d25 50%,#100820 100%);color:#DDE3F5;min-height:100svh;padding-bottom:env(safe-area-inset-bottom,20px);}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;border:none;}
.rj{font-weight:800;letter-spacing:-.03em;}
@keyframes popIn{0%{transform:scale(0);opacity:0}65%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
@keyframes spin2{0%,100%{opacity:1}50%{opacity:.3}}
.ap{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;}
.as{animation:spin2 1.4s ease-in-out infinite;}
#hdr{padding:max(env(safe-area-inset-top,14px),14px) 14px 12px;text-align:center;border-bottom:1px solid rgba(251,191,36,.12);background:linear-gradient(180deg,rgba(251,191,36,.06) 0%,transparent 100%);}
#hdr h1{font-size:22px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#FBBF24,#FB923C,#FBBF24);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite;}
#hdr p{font-size:10px;color:#5A6A8E;margin-top:4px;}
.zdots{display:flex;gap:8px;justify-content:center;margin-top:7px;flex-wrap:wrap;}
.zdot{display:flex;align-items:center;gap:3px;font-size:9px;}
.zd{width:7px;height:7px;border-radius:50%;}
#stats{display:flex;gap:7px;padding:10px 9px 0;}
.stat{flex:1;background:rgba(255,255,255,.04);border-radius:13px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06);}
.sv{font-size:16px;font-weight:800;letter-spacing:-.03em;}
.sl{font-size:9px;color:#6B7A9E;margin-top:2px;}
#tab-nav{display:flex;gap:5px;overflow-x:auto;padding:10px 9px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#tab-nav::-webkit-scrollbar{display:none;}
.tb{padding:8px 11px;border-radius:18px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:#7080A0;font-size:11px;white-space:nowrap;flex-shrink:0;min-height:36px;transition:all .15s;}
.tb.on{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.11);color:#FBBF24;font-weight:700;}
#content{padding:0 9px;}
.card{background:rgba(255,255,255,.035);border-radius:18px;border:1px solid rgba(255,255,255,.07);padding:14px 12px;margin-bottom:10px;}
.cg{background:rgba(74,222,128,.04);border-color:rgba(74,222,128,.18);}
.cd{background:rgba(255,255,255,.02);}
.ttl{font-size:12px;font-weight:700;margin-bottom:11px;}
.ball{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;user-select:none;flex-shrink:0;}
.sb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:9px;font-weight:800;}
.freq-bars{display:flex;gap:1px;align-items:flex-end;height:120px;overflow-x:auto;padding:0 0 4px;}
.fb{width:7px;min-width:7px;border-radius:2px 2px 0 0;}
.tag{font-size:9px;padding:2px 6px;border-radius:5px;}
.set-tags{display:flex;gap:5px;margin-top:7px;margin-left:29px;}
.bt-table{width:100%;font-size:10px;border-collapse:collapse;}
.bt-table th{padding:6px 5px 8px;color:#5A6A8E;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);}
.bt-table td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.05);}
.duo-row{background:rgba(255,255,255,.025);border-radius:14px;padding:11px 10px;margin-bottom:8px;border:1px solid rgba(251,191,36,.12);}
.sdkc{width:56px;height:56px;border-radius:0;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;}
.sdk6{width:40px;height:40px;font-size:18px;}
.sdk9{width:28px;height:28px;font-size:14px;}
@keyframes sdk-pop-kf{0%{transform:scale(1)}30%{transform:scale(1.1);box-shadow:0 0 12px rgba(74,222,128,.8);background:rgba(74,222,128,.28)}100%{transform:scale(1)}}
.sdk-pop{animation:sdk-pop-kf .7s ease;}
@keyframes sdk-bad-kf{0%,100%{transform:scale(1)}40%{transform:scale(1.06);box-shadow:0 0 10px rgba(248,113,113,.7)}}
.sdk-bad{animation:sdk-bad-kf .45s ease;}
.sdkp{width:54px;height:46px;border-radius:12px;font-size:18px;font-weight:800;}
.sdkp6{width:34px;height:44px;border-radius:10px;font-size:15px;}
.sdkp9{width:46px;height:42px;border-radius:10px;font-size:15px;}
.footer{text-align:center;font-size:9px;color:#3A4460;line-height:1.9;padding:4px 8px 20px;}
#err-banner{display:none;position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:12px 14px;z-index:9999;font-size:11px;line-height:1.7;word-break:break-all;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="err-banner"></div>
<div id="hdr">
  <h1>🎱 로또 번호 분석기 <span id="app-env" style="display:none;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle"></span></h1>
  <p>제 <strong style="color:#FBBF24" id="h-next">…</strong>회 추천 &nbsp;·&nbsp; 전체 <strong style="color:#C084FC" id="h-total">…</strong>회</p>
  <div id="acct" style="margin-top:8px"></div>
</div>
<div id="tab-nav"></div>
<div id="content"><div style="text-align:center;padding:40px;color:#6B7A9E">불러오는 중...</div></div>
<div id="ver-badge" style="position:fixed;right:10px;bottom:8px;font-size:9px;color:#445066;z-index:40;pointer-events:none;font-family:ui-monospace,monospace"></div>
<div id="pick-toast" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:34px;max-width:86%;background:#141A2E;border:1px solid rgba(251,191,36,.4);color:#E8ECFF;font-size:12px;line-height:1.5;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:0 4px 20px rgba(0,0,0,.5);text-align:center"></div>

<!-- 로그인 모달 -->
<div id="auth-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,10,.75);z-index:50;padding:20px;overflow-y:auto">
  <div style="max-width:360px;margin:60px auto;background:#0d0d28;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="auth-title" style="font-size:16px;font-weight:800;color:#E8ECFF">로그인</div>
      <button onclick="closeAuth()" style="background:none;border:none;color:#6B7A9E;font-size:20px;padding:4px 8px">✕</button>
    </div>
    <input id="auth-email" type="email" placeholder="이메일" autocomplete="email" style="width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#E8ECFF;font-size:14px;margin-bottom:9px">
    <input id="auth-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#E8ECFF;font-size:14px;margin-bottom:12px">
    <label style="display:flex;align-items:center;gap:7px;font-size:11px;color:#7080A0;margin-bottom:8px"><input type="checkbox" id="auth-remember" checked style="width:16px;height:16px;accent-color:#2563EB"> 이메일 저장</label>
    <div id="auth-msg" style="font-size:11px;color:#F87171;min-height:16px;margin-bottom:8px"></div>
    <button id="auth-submit" onclick="doAuth()" style="width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;font-weight:700;font-size:14px;margin-bottom:9px">로그인</button>
    <button onclick="toggleAuthMode()" id="auth-toggle" style="width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:none;color:#7080A0;font-size:12px;margin-bottom:14px">처음이신가요? 회원가입</button>
    <button onclick="doRecover()" style="width:100%;padding:8px;background:none;border:none;color:#5A6A8E;font-size:11px;text-decoration:underline">비밀번호를 잊으셨나요?</button>
  </div>
</div>

<script>
// ── v4.1: 서버 분리 클라이언트 + 출석 레벨 시스템 (알고리즘 없음) ──
function showErr(msg){
  var b=document.getElementById('err-banner');
  if(b){b.style.display='block';b.innerHTML='<b>오류:</b><br>'+msg;}
}
window.onerror=function(m,u,l){showErr(m+' (줄:'+l+')');return true;};

var SB_URL='https://gdckvqbolfwtrydeervz.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkY2t2cWJvbGZ3dHJ5ZGVlcnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTgzNzIsImV4cCI6MjEwMjk3NDM3Mn0.UDNfuKVhXI-kGQVt3Z1_Rcy7ewW1oGkKLO7_aJwOMR8';
var APP_VERSION='2.0.9.06';
var APP_ENV='qa'; // 배포 파이프라인이 dev/qa로 치환
var sb=window.supabase.createClient(SB_URL,SB_ANON);

var LEVELS=[
  {lv:0,name:'게스트',c:'#6B7A9E',desc:'순수 랜덤 번호만',cond:'-'},
  {lv:1,name:'회원',c:'#38BDF8',desc:'기본 필터 + 5개일치 회피 · 빈도/기록 열람',cond:'가입 즉시'},
  {lv:2,name:'실버',c:'#C0C8D8',desc:'+ 독식지수(인기 회피) · 핫&콜드 열람',cond:'출석 +1일'},
  {lv:3,name:'골드',c:'#FBBF24',desc:'+ 세트 구조 전략(분산/집중) · 프리미엄 정보',cond:'실버에서 +1일 더'}
];
var MASTER={lv:100,name:'마스터',c:'#F472B6',desc:'운영자',cond:'-'};
var TESTER={lv:99,name:'테스터',c:'#4ADE80',desc:'테스트 계정',cond:'-'};
function lvInfo(lv){if(lv===100)return MASTER;if(lv===99)return TESTER;return LEVELS[Math.max(0,Math.min(3,lv))];}
function effLv(){return(state.level===100||state.level===99)?3:state.level;}

var TABS=[
  {id:'rec',label:'🎯 추천',min:0},
  {id:'freq',label:'📊 빈도',min:1},
  {id:'hist',label:'📋 기록',min:1},
  {id:'hot',label:'🔥 핫&콜드',min:2},
  {id:'prem',label:'🔮 프리미엄',min:3},
  {id:'games',label:'🎮 미니게임',min:0},
  {id:'adm',label:'🛠 관리',min:100},
  {id:'me',label:'👤 내정보',min:0}
];

var ZONES=[
  {lo:1,hi:10,c:"#FBBF24",tc:"#1A1000"},{lo:11,hi:20,c:"#38BDF8",tc:"#001525"},
  {lo:21,hi:30,c:"#F87171",tc:"#200000"},{lo:31,hi:40,c:"#C084FC",tc:"#120025"},
  {lo:41,hi:45,c:"#4ADE80",tc:"#001A00"}
];
var SETC=["#FBBF24","#4ADE80","#38BDF8","#F87171","#C084FC"];
var SETL=["A","B","C","D","E"];

var state={session:null,level:0,streak:0,toNext:null,notice:'',mode:'wide',rec:null,recBusy:false,draws:null,latestWin:null,latestWinBusy:false,tab:'rec',authMode:'login',providers:{google:false,kakao:false},admin:null,admBusy:false,recovery:false,pick:[],diag:null,diagBusy:false,semi:null,semiBusy:false,myPicks:null,picksBusy:false,saveBusy:false,savedKeys:{},game:null,fw:null,mm:null,lb:{},sdk:{bank:null,bankBusy:false,bankErr:false,bank6:null,bank6Busy:false,bank6Err:false,bank9:null,bank9Busy:false,bank9Err:false,st:null,stBusy:false,date:null,cells:null,given:null,solution:{},done:null,sel:null,startMs:{m:0,b:0,c:0},busy:{},conf:{},celeb:{m:{},b:{},c:{}}}};

function gz(n){for(var i=0;i<5;i++)if(n>=ZONES[i].lo&&n<=ZONES[i].hi)return ZONES[i];return ZONES[0];}
function ballHTML(n,size,glow,delay){
  var z=gz(n);
  var sh=glow?'0 0 14px '+z.c+'BB,0 3px 10px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.5)':'0 3px 10px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.45)';
  return '<div class="ball ap" style="width:'+size+'px;height:'+size+'px;background:radial-gradient(circle at 37% 32%,'+z.c+'FF 0%,'+z.c+'CC 55%,'+z.c+'99 100%);color:'+z.tc+';font-size:'+Math.round(size*.33)+'px;box-shadow:'+sh+';animation-delay:'+delay+'ms">'+n+'</div>';
}
function rdate(r){var d=new Date(1039264200000+(r-1)*7*864e5);return d.getFullYear()+'.'+(''+(d.getMonth()+1)).padStart(2,'0')+'.'+(''+d.getDate()).padStart(2,'0');}
function fmtNum(x){return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtWon(x){
  var n=Number(x);
  if(x===null||x===undefined||!isFinite(n)||n<=0)return '-';
  if(n>=100000000){var e=Math.floor(n/100000000),m=Math.floor(n%100000000/10000);return fmtNum(e)+'억'+(m>0?fmtNum(m)+'만':'')+'원';}
  if(n>=10000)return fmtNum(Math.floor(n/10000))+'만원';
  if(n>=1000)return Math.floor(n/1000)+'천원';
  return fmtNum(n)+'원';
}
function maskEmail(email){
  if(!email)return '';
  var s=String(email);
  var at=s.indexOf('@');
  var local=at>-1?s.slice(0,at):s;
  var domain=at>-1?s.slice(at):'';
  var keep=local.length>=6?3:local.length>=3?2:1;
  return local.slice(0,keep)+'***'+domain;
}
function sBox(val,lbl,c){return '<div style="flex:1;background:rgba(255,255,255,.04);border-radius:13px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06)"><div class="sv rj" style="color:'+c+'">'+val+'</div><div class="sl">'+lbl+'</div></div>';}

// ── 상단 계정/탭 ──
function renderAcct(){
  var el=document.getElementById('acct');if(!el)return;
  if(state.session){
    var li=lvInfo(state.level);
    var streakStr=state.streak>0?'<span style="font-size:10px;color:#F97316;margin-right:6px">🔥 '+state.streak+'일</span>':'';
    el.innerHTML='<span style="font-size:11px;color:#9AA6C8">'+maskEmail(state.session.user.email||'')+'</span> <span style="font-size:10px;font-weight:800;color:'+li.c+';background:'+li.c+'22;border:1px solid '+li.c+'55;padding:2px 9px;border-radius:9px;margin:0 6px">Lv.'+(state.level===100?'M':state.level===99?'T':state.level)+' '+li.name+'</span>'+streakStr+'<button onclick="doLogout()" style="font-size:10px;color:#6B7A9E;background:none;border:1px solid rgba(255,255,255,.15);padding:3px 10px;border-radius:9px">로그아웃</button>';
  }else{
    el.innerHTML='<span style="font-size:10px;font-weight:800;color:#6B7A9E;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:2px 9px;border-radius:9px;margin-right:6px">게스트</span><button onclick="openAuth()" style="font-size:11px;font-weight:700;color:#38BDF8;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);padding:4px 14px;border-radius:9px">로그인</button>';
  }
}
function renderTabs(){
  var nav=document.getElementById('tab-nav');if(!nav)return;
  var html='';
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    if(t.min===100&&state.level!==100)continue; // 관리 탭은 마스터에게만 노출
    var locked=state.level===100?false:(effLv()<t.min);
    html+='<button class="tb'+(state.tab===t.id?' on':'')+'" onclick="doTab(\''+t.id+'\')" data-t="'+t.id+'" style="'+(locked?'opacity:.45':'')+'">'+(locked?'🔒 ':'')+t.label+'</button>';
  }
  nav.innerHTML=html;
}

// ── 추천 탭 ──
function renderLadder(){
  var rows='';
  for(var i=0;i<LEVELS.length;i++){
    var L=LEVELS[i],mine=L.lv===state.level||((state.level===100||state.level===99)&&L.lv===3),locked=effLv()<L.lv;
    rows+='<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:11px;margin-bottom:5px;background:'+(mine?L.c+'14':'rgba(255,255,255,.02)')+';border:1px solid '+(mine?L.c+'55':'rgba(255,255,255,.05)')+'">'
      +'<span style="flex-shrink:0;font-size:10px;font-weight:800;color:'+(locked?'#4A5570':L.c)+';min-width:52px">'+(mine?'▶ ':'')+'Lv.'+L.lv+' '+L.name+'</span>'
      +'<span style="font-size:10px;color:'+(locked?'#4A5570':'#9AA6C8')+';line-height:1.5;flex:1">'+(locked?'🔒 ':'')+L.desc+'</span>'
      +'<span style="flex-shrink:0;font-size:9px;color:'+(locked?'#5A6A8E':'#4ADE80')+'">'+L.cond+'</span></div>';
  }
  return rows;
}
function latestWinCardHTML(){
  var lw=state.latestWin;
  if(!lw||typeof lw.won1_count!=='number'||typeof lw.won1_amount!=='number')return '';
  return '<div class="card cd"><div style="font-size:11px;color:#C4CCEE;line-height:1.9;text-align:center">📋 제'+lw.round+'회 1등 당첨자 <b style="color:#FBBF24">'+fmtNum(lw.won1_count)+'명</b> · 1인당 당첨금 <b style="color:#FBBF24">'+fmtNum(lw.won1_amount)+'원</b><br><span style="font-size:9px;color:#5A6A8E">동행복권 공식 발표 기준</span></div></div>';
}
function renderRec(){
  var li=lvInfo(state.level);
  var html='<div id="rec-win-fact">'+latestWinCardHTML()+'</div>';
  if(state.notice){
    html+='<div class="card" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)"><div style="font-size:13px;font-weight:700;color:#FBBF24;text-align:center">'+state.notice+'</div></div>';
  }
  var prog='';
  if(state.session&&state.level>=1&&state.level<=2&&state.toNext!==null){
    var need=1,done=need-state.toNext;
    var pct=Math.round(done/need*100);
    prog='<div style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-size:10px;color:#7080A0;margin-bottom:4px"><span>🔥 연속 출석 '+state.streak+'일</span><span>'+lvInfo(state.level+1).name+'까지 '+state.toNext+'일</span></div><div style="background:rgba(255,255,255,.08);border-radius:6px;height:7px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#F97316,#FBBF24);border-radius:6px"></div></div></div>';
  }
  html+='<div class="card" style="padding:12px 14px"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:12px;font-weight:800;color:'+li.c+'">🏅 '+(state.level===100?'👑 마스터':state.level===99?'🧪 테스터':'Lv.'+state.level+' '+li.name)+'</span><span onclick="doTab(\'me\')" style="font-size:10px;color:#5A6A8E;text-decoration:underline;cursor:pointer">레벨 안내 →</span></div>'+prog
    +(state.level===0?'<div style="font-size:11px;color:#38BDF8;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:10px;padding:9px 12px;margin-top:10px">💡 무료 가입 시 분석 알고리즘 + 매일 접속만 해도 자동 승급됩니다 → <b onclick="openAuth()" style="text-decoration:underline;cursor:pointer">로그인/가입</b></div>':'')

// ── 일일 수도쿠 스트릭 (Phase 2) — 로또 출석(🔥)과 완전 별개 ──
// 퍼즐: sudoku_bank*.json(클루만, 정답 없음)에서 날짜 해시로 결정적 선택 (전 유저 공용)
// 채점: 클라 검증(행·열·블록 유일성) → 서버 sudoku 함수에 스탬프 제출
// 티어 3종: m=메인 4×4(스트릭 인정) · b=보너스1 6×6 · c=보너스2 9×9 (보너스는 누적만 +1)
// SDK_CFG: size=한 변, bw/bh=블록 가로/세로, pgap=숫자패드 버튼 간격
// 격자: 셀 간 여백 없이 테두리로 구분 — 일반 칸 1px, 블록 경계·외곽 3px (정통 수도쿠 스타일)
//   (셀 크기: 최소 뷰포트 320px → 카드 내부폭 278px 기준. 9×9: 28*9+3*2=258px, border-box라 셀 안쪽으로 선이 그려짐)
var SDK_CFG={
  m:{size:4,bw:2,bh:2,tier:'main',cls:'sdkc',pcls:'sdkp',pgap:6,blockTxt:'2×2칸'},
  b:{size:6,bw:2,bh:3,tier:'bonus1',cls:'sdkc sdk6',pcls:'sdkp sdkp6',pgap:4,blockTxt:'2×3칸'},
  c:{size:9,bw:3,bh:3,tier:'bonus2',cls:'sdkc sdk9',pcls:'sdkp sdkp9',pgap:5,blockTxt:'3×3칸'}
};
var SDK_WHICHES=['m','b','c'];
var SDK_BADGES=[
  {kind:'streak_1',icon:'🥉',label:'첫 퍼즐'},
  {kind:'streak_3',icon:'🥈',label:'3일 연속'},
  {kind:'streak_7',icon:'🥇',label:'7일 연속'},
  {kind:'trial_1d',icon:'🎟️',label:'14일 연속 · 프리미엄 1일 체험권'},
  {kind:'trial_3d',icon:'🏆',label:'30일 연속 · 프리미엄 3일 체험권'},
  {kind:'total_100',icon:'💯',label:'누적 100문제'}
];
function sdkToday(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
function sdkHash(s){var h=5381,i;for(i=0;i<s.length;i++){h=(h*33+s.charCodeAt(i))%1000000007;}return h;}
function sdkGroupList(which){
  var cfg=SDK_CFG[which],n=cfg.size,gs=[],r,c,br,bc,i,j,g;
  for(r=0;r<n;r++){g=[];for(c=0;c<n;c++)g.push(r*n+c);gs.push(g);}
  for(c=0;c<n;c++){g=[];for(r=0;r<n;r++)g.push(r*n+c);gs.push(g);}
  for(br=0;br<n;br+=cfg.bh)for(bc=0;bc<n;bc+=cfg.bw){
    g=[];for(i=0;i<cfg.bh;i++)for(j=0;j<cfg.bw;j++)g.push((br+i)*n+bc+j);gs.push(g);
  }
  return gs;
}
function sdkCheck(cells,which){
  var cfg=SDK_CFG[which],n=cfg.size,n2=n*n,i,j;
  if(!cells||cells.length!==n2)return false;
  for(i=0;i<n2;i++)if(!cells[i]||cells[i]<1||cells[i]>n)return false;
  var gs=sdkGroupList(which);
  for(i=0;i<gs.length;i++){
    var seen={},g=gs[i];
    for(j=0;j<g.length;j++){var v=cells[g[j]];if(seen[v])return false;seen[v]=1;}
  }
  return true;
}
function sdkBankOf(which){
  if(which==='m')return state.sdk.bank;
  if(which==='b')return state.sdk.bank6;
  return state.sdk.bank9;
}
function sdkPuzzleIdx(which){
  var bank=sdkBankOf(which);
  if(!bank||!bank.puzzles||!bank.puzzles.length)return -1;
  var n=bank.puzzles.length,d=sdkToday();
  var salt=which==='m'?'':(which==='b'?'B1':'B2');
  return sdkHash(d+salt)%n;
}
function sdkPuzzleStr(which){
  var bank=sdkBankOf(which),idx=sdkPuzzleIdx(which);
  return idx<0?null:bank.puzzles[idx];
}
// 뱅크의 인코딩 정답(sols) 복호화 — 생성기(gen-sudoku-bank*.mjs)와 동일 스킴:
//   enc[i]=((s[i]-1+ks(i))%n)+1, ks(i)=sdkHash(p+'K'+i)%n (p=클루 문자열이 곧 시드 — 별도 키 불필요)
// 역연산: s[i]=((e[i]-1-ks(i)+n)%n)+1. 실패(길이·범위 이상) 시 null.
function sdkDecodeSol(p,enc,n){
  if(!p||!enc||enc.length!==p.length)return null;
  var out=[],i,ks,v;
  for(i=0;i<p.length;i++){
    ks=sdkHash(p+'K'+i)%n;
    v=enc.charCodeAt(i)-48;
    if(v<1||v>n)return null;
    out.push(((v-1-ks+n)%n)+1);
  }
  return out;
}
function sdkDoneLocal(){var f='';try{f=localStorage.getItem('lotto-sdk-done-'+sdkToday())||'';}catch(e){}return f;}
function sdkMarkDoneLocal(which){try{var f=sdkDoneLocal();if(f.indexOf(which)<0)localStorage.setItem('lotto-sdk-done-'+sdkToday(),f+which);}catch(e){}}
function sdkSaveLocal(){try{localStorage.setItem('lotto-sdk-'+state.sdk.date,JSON.stringify({m:state.sdk.cells.m,b:state.sdk.cells.b,c:state.sdk.cells.c}));}catch(e){}}
// 날짜 바뀌면 전체 초기화, 같은 날엔 아직 뱅크가 안 온 티어만 증분 초기화
function sdkInit(){
  var d=sdkToday();
  if(state.sdk.date!==d||!state.sdk.cells){
    state.sdk.date=d;state.sdk.cells={};state.sdk.given={};state.sdk.solution={};state.sdk.done={m:false,b:false,c:false};state.sdk.sel=null;state.sdk.startMs={m:0,b:0,c:0};state.sdk.conf={};state.sdk.celeb={m:{},b:{},c:{}};
  }
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('lotto-sdk-'+d)||'null');}catch(e){saved=null;}
  var w,i;
  for(w=0;w<SDK_WHICHES.length;w++){
    var which=SDK_WHICHES[w];
    if(state.sdk.cells[which])continue;
    var pz=sdkPuzzleStr(which);
    if(!pz)continue;
    var n2=SDK_CFG[which].size*SDK_CFG[which].size,nmax=SDK_CFG[which].size,cells=[],given=[];
    if(pz.length!==n2)continue;
    for(i=0;i<n2;i++){var ch=pz.charAt(i),v=ch==='0'?0:parseInt(ch,10);cells.push(v);given.push(v>0);}
    if(saved&&saved[which]&&saved[which].length===n2){
      for(i=0;i<n2;i++){var sv=saved[which][i];if(!given[i]&&sv>=1&&sv<=nmax)cells[i]=sv;}
    }
    state.sdk.cells[which]=cells;state.sdk.given[which]=given;
    // 인코딩 정답 복호화해 보관 — 그룹 완성(축하) 판정은 이 배열과의 정확 일치로만 한다
    if(!state.sdk.solution)state.sdk.solution={};
    var bank=sdkBankOf(which),pidx=sdkPuzzleIdx(which);
    state.sdk.solution[which]=(bank&&bank.sols&&bank.sols[pidx])?sdkDecodeSol(pz,bank.sols[pidx],nmax):null;
  }
  var df=sdkDoneLocal();
  if(df.indexOf('m')>=0)state.sdk.done.m=true;
  if(df.indexOf('b')>=0)state.sdk.done.b=true;
  if(df.indexOf('c')>=0)state.sdk.done.c=true;
  if(state.sdk.st){
    if(state.sdk.st.todayMain)state.sdk.done.m=true;
    if(state.sdk.st.todayBonus1)state.sdk.done.b=true;
    if(state.sdk.st.todayBonus2)state.sdk.done.c=true;
  }
}

// 게스트로 풀고 나서 로그인한 경우 등 — 로컬 완료분을 서버에 재제출
// (구 4×4 보너스 완료 플래그 'b'는 6×6 셀 검증에 실패하므로 자동 무시됨)
function sdkMaybeResubmit(){
  var st=state.sdk.st;

// 셀 i가 속한 행·열·블록의 그룹 인덱스 3개 (sdkGroupList 순서: 행들→열들→블록들)
function sdkGroupsOf(which,i){
  var cfg=SDK_CFG[which],n=cfg.size,r=Math.floor(i/n),c=i%n;
  var bi=Math.floor(r/cfg.bh)*Math.floor(n/cfg.bw)+Math.floor(c/cfg.bw);

}
// 현재 충돌(같은 행·열·블록 안에 동일 숫자) 상태인 셀 인덱스 집합
function sdkConflictSet(which){
  var gs=sdkGroupList(which),cells=state.sdk.cells[which],set={},gi,j,v,cnt,g;
  for(gi=0;gi<gs.length;gi++){
    g=gs[gi];cnt={};
    for(j=0;j<g.length;j++){v=cells[g[j]];if(v)cnt[v]=(cnt[v]||0)+1;}
    for(j=0;j<g.length;j++){v=cells[g[j]];if(v&&cnt[v]>1)set[g[j]]=1;}
  }
  return set;
}
function sdkRecalcConf(which){

function sdkIsConf(which,i){var m=state.sdk.conf&&state.sdk.conf[which];return !!(m&&m[i]);}

// 그룹 "진짜 완성" 판정: 그룹 자체가 유일성 만족(sdkGroupOk) + 그 그룹의 어떤 칸도
// 다른 그룹과의 전역 충돌셋(sdkIsConf)에 걸려있지 않아야 함 — 충돌 빨간 배경 위에 초록 펄스가 덮이는 것 방지
function sdkGroupClean(which,g){
  if(!sdkGroupOk(which,g))return false;
  var j;
  for(j=0;j<g.length;j++)if(sdkIsConf(which,g[j]))return false;
  return true;
}
// 그룹 완성(축하) 판정 v2: "중복 없음"이 아니라 "정답과 정확히 일치"여야 축하.
// 중복 없이 채워도 정답과 다른 배치면 나중에 모순이 드러나 되돌려야 함(오너 실제 재현) — 그 경우 축하 금지.
// 정답이 없을 때(구 뱅크 캐시 등)만 종전 sdkGroupClean으로 폴백.
function sdkGroupMatchesSolution(which,g){
  var sol=state.sdk.solution&&state.sdk.solution[which];
  if(!sol)return sdkGroupClean(which,g);
  var cells=state.sdk.cells[which],j;
  for(j=0;j<g.length;j++)if(cells[g[j]]!==sol[g[j]])return false;
  return true;
}
// 입력 셀이 속한 행·열·블록의 셀만 재페인트(4×4=8칸·6×6=13칸·9×9=21칸, 전체 재렌더 없음)
// + 충돌 펄스 + "방금 완성된" 그룹 축하 효과
function sdkPaintAround(which,i){
  var gs=sdkGroupList(which),gis=sdkGroupsOf(which,i),touch={},k,j,g,key;
  for(k=0;k<3;k++){g=gs[gis[k]];for(j=0;j<g.length;j++)touch[g[j]]=1;}
  for(key in touch)if(touch.hasOwnProperty(key))sdkPaintCell(which,parseInt(key,10));
  if(!state.sdk.celeb)state.sdk.celeb={m:{},b:{},c:{}};
  var celeb=state.sdk.celeb[which];
  // 완성 판정은 "편집한 칸이 속한 3개 그룹"만: 축하는 그 그룹을 직접 편집해 완성시켰을 때만.
  // 다른 곳 편집으로 간접적으로 깨끗해진 그룹이 뒤늦게 축하받으면 안 됨(오너 피드백).
  // 판정은 sdkGroupMatchesSolution — 복호화한 정답과 정확 일치해야 축하 (중복 없음만으론 오발동, 오너 재현).
  for(k=0;k<3;k++){
    var gi=gis[k];g=gs[gi];
    if(sdkGroupMatchesSolution(which,g)){
      if(!celeb[gi]){celeb[gi]=1;sdkFlash(which,g,'sdk-pop',750);}
    }else if(celeb[gi])delete celeb[gi];
  }
  if(sdkIsConf(which,i))sdkFlash(which,[i],'sdk-bad',480);
}
// cls를 잠깐 붙였다 떼는 원샷 애니메이션 (setTimeout 콜백은 iOS 지침대로 try-catch)
function sdkFlash(which,idxs,cls,ms){
  var els=[],j,el;
  for(j=0;j<idxs.length;j++){
    el=document.getElementById('sdk-c-'+which+'-'+idxs[j]);
    if(el){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);els.push(el);}
  }
  setTimeout(function(){try{var x;for(x=0;x<els.length;x++)els[x].classList.remove(cls);}catch(e){}},ms);
}
function sdkAfterInput(which){

      state.sdk.busy[which]=false;
      var el2=document.getElementById('sdk-sub-'+which);
      if(el2)el2.textContent='⚠ 서버 연결 실패 — 탭을 다시 열면 자동 재시도합니다';
    });
}
// 오늘 메인 퍼즐 완료 여부 (서버 현황 우선, 없으면 로컬 플래그)

// ── 🏆 주간 리더보드 (scores Edge Function) — 일요일 00시(KST) 리셋, 게임·티어별 최단 기록 ──
// week_start·마스킹은 전부 서버 계산 — 클라이언트는 표시와 제출만 담당 (원본 이메일 미수신)
// 캐시: state.lb[key]에 보관, LB_TTL 지나면 재조회. 갱신은 해당 박스만 국소 페인트(전체 재렌더 없음)
var LB_TTL=300000; // 5분
var MM_TIER={e:'easy',m:'normal',h:'hard'};
var LB_LABEL={'memory|easy':'쉬움 4×4','memory|normal':'보통 6×6','memory|hard':'어려움 9×9'};
function lbKey(g,t){return g+'|'+(t||'');}
function lbElId(g,t){return 'lb-'+g+(t?'-'+t:'');}
function lbInnerHTML(g,t){
  var e=state.lb[lbKey(g,t)];
  var lab=LB_LABEL[lbKey(g,t)];
  var head='🏆 이번 주 최단'+(lab?' · '+lab:'');
  if(e&&e.err)return '<span style="color:#5A6A8E">'+head+' — 기록을 불러오지 못했어요</span>';
  if(!e||!e.loaded)return '<span style="color:#5A6A8E">'+head+' — 불러오는 중...</span>';
  var mineLine=(typeof e.mine==='number')?'<br><span style="color:#7DD3FC">내 최단: '+fmtNum(e.mine)+'초</span>':'';
  if(!e.top)return '<span style="color:#7080A0">'+head+' — 아직 기록이 없어요, 첫 기록의 주인공이 되어보세요!</span>'+mineLine;
  return '<span style="color:#FBBF24">'+head+': <b>'+e.top.name+'</b> '+fmtNum(e.top.seconds)+'초</span>'+mineLine;
}
function lbPaint(g,t){var el=document.getElementById(lbElId(g,t));if(el)el.innerHTML=lbInnerHTML(g,t);}
function lbBoxHTML(g,t){
  var e=state.lb[lbKey(g,t)];
  if(!e||!e.loaded||(Date.now()-(e.ts||0)>LB_TTL))lbLoad(g,t,false);
  return '<div id="'+lbElId(g,t)+'" style="font-size:10px;text-align:center;margin-bottom:9px;padding:7px 8px;border-radius:10px;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.16)">'+lbInnerHTML(g,t)+'</div>';
}
function lbLoad(g,t,force){
  var k=lbKey(g,t),e=state.lb[k];
  if(e&&e.busy)return;
  if(e&&e.loaded&&!force&&Date.now()-(e.ts||0)<=LB_TTL)return;
  state.lb[k]={busy:true,loaded:e?e.loaded:false,top:e?e.top:null,mine:e?e.mine:null,ts:e?e.ts:0,err:false};
  var tok=state.session?state.session.access_token:SB_ANON;
  fetch(SB_URL+'/functions/v1/scores?game_id='+g+'&tier='+encodeURIComponent(t||''),{headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(j){
      var e2=state.lb[k];
      e2.busy=false;
      if(j&&j.ok){e2.loaded=true;e2.top=j.top||null;e2.mine=(typeof j.mine==='number')?j.mine:null;e2.ts=Date.now();e2.err=false;}
      else e2.err=true;
      lbPaint(g,t);
    })
    .catch(function(err){var e3=state.lb[k];e3.busy=false;e3.err=true;lbPaint(g,t);});
}
// 완료 시 기록 제출 — 로그인 유저만 (게스트는 스킵). 응답의 top으로 박스만 국소 갱신
function lbSubmit(g,t,secs){
  if(!state.session)return;
  var s=Math.round(secs||0);if(s<1)s=1;if(s>86400)s=86400;
  fetch(SB_URL+'/functions/v1/scores',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'submit',game_id:g,tier:t||'',seconds:s})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.ok)return;
      var k=lbKey(g,t);
      state.lb[k]={busy:false,loaded:true,top:j.top||null,mine:(typeof j.best==='number')?j.best:null,ts:Date.now(),err:false};
      lbPaint(g,t);
      if(j.improved)pickToast('🏆 이번 주 내 최고 기록 갱신! '+fmtNum(j.best)+'초');
    })
    .catch(function(e){});
}

// ── 🔍 틀린 번호 찾기 (Phase 3) — 순수 클라이언트 게임 ──
// 1~45 랜덤 5×5 그리드 2개(원본/비교) — 비교판의 3~5칸만 다른 숫자. 퍼즐뱅크·서버 저장 없음, 매 판 즉석 생성.
var FW_N=5,FW_MAX=45;
function fwNew(){
  var n2=FW_N*FW_N,left=[],i,r,t;
  for(i=0;i<n2;i++)left.push(1+Math.floor(Math.random()*FW_MAX));
  var total=3+Math.floor(Math.random()*3); // 다른 칸 3~5개
  var pool=[];
  for(i=0;i<n2;i++)pool.push(i);
  for(i=0;i<total;i++){r=i+Math.floor(Math.random()*(n2-i));t=pool[i];pool[i]=pool[r];pool[r]=t;}
  var right=left.slice(),diff={};
  for(i=0;i<total;i++){
    var idx=pool[i],nv=left[idx];
    while(nv===left[idx])nv=1+Math.floor(Math.random()*FW_MAX);
    right[idx]=nv;diff[idx]=1;
  }
  state.fw={left:left,right:right,diff:diff,found:{},foundCnt:0,total:total,startMs:Date.now(),done:false,doneSecs:0};
}
function fwCellStyle(side,i){
  var fw=state.fw,s='width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;padding:0;border:none;';
  if(fw.found[i]){
    if(side==='r')s+='background:rgba(74,222,128,.2);color:#4ADE80;box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.7);';
    else s+='background:rgba(74,222,128,.08);color:#86EFAC;';
  }
  else if(side==='l')s+='background:rgba(255,255,255,.07);color:#AAB6D8;';
  else s+='background:rgba(56,189,248,.07);color:#7DD3FC;';
  return s;
}
function fwGridHTML(side){
  var fw=state.fw,html='',r,c,i;
  for(r=0;r<FW_N;r++){
    html+='<div style="display:flex;gap:4px;justify-content:center;margin-top:'+(r?4:0)+'px">';
    for(c=0;c<FW_N;c++){
      i=r*FW_N+c;
      if(side==='l')html+='<div id="fw-l-'+i+'" style="'+fwCellStyle('l',i)+'">'+fw.left[i]+'</div>';
      else html+='<button id="fw-r-'+i+'" onclick="fwClick('+i+')" style="'+fwCellStyle('r',i)+'">'+fw.right[i]+'</button>';
    }
    html+='</div>';
  }
  return html;
}
function fwBoardHTML(){
  var fw=state.fw;
  return '<div><div style="font-size:10px;color:#8B98B8;text-align:center;margin-bottom:6px">원본</div>'+fwGridHTML('l')+'</div>'
    +'<div style="margin-top:14px"><div style="font-size:10px;color:#38BDF8;text-align:center;margin-bottom:6px">비교 — 여기서 찾기!</div>'+fwGridHTML('r')+'</div>'
    +'<div style="text-align:center;margin-top:11px;font-size:11px;color:#4ADE80;font-weight:800">찾음 <span id="fw-cnt">'+fw.foundCnt+'</span> / '+fw.total+'</div>'
    +'<div id="fw-msg" style="font-size:10px;color:#F87171;text-align:center;min-height:15px;margin-top:6px"></div>';
}
function fwDoneHTML(){
  var fw=state.fw;
  return '<div class="ap" style="text-align:center;padding:16px 0"><div style="font-size:34px;margin-bottom:6px">🎉</div><div style="font-size:13px;font-weight:800;color:#4ADE80">'+fw.total+'개 전부 찾았어요!</div><div style="font-size:11px;color:#9AA6C8;margin-top:6px">소요 시간 <b style="color:#FBBF24">'+fw.doneSecs+'초</b></div><button onclick="fwRestart()" style="margin-top:14px;padding:11px 24px;border-radius:11px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;font-weight:700;font-size:13px;border:none">🔄 새 판 시작</button></div>';
}
function fwMsg(t){var el=document.getElementById('fw-msg');if(el)el.textContent=t||'';}
function fwRestart(){
  fwNew();
  var body=document.getElementById('fw-body');
  if(body)body.innerHTML=fwBoardHTML();
  var sub=document.getElementById('fw-sub');
  if(sub)sub.textContent='위 원본과 다른 칸이 아래 비교판에 '+state.fw.total+'개 숨어 있어요 — 아래에서 찾아 누르세요!';
}
// 클릭한 셀만 국소 갱신 (전체 재렌더 없음) — 정답=초록 고정, 오답=빨간 펄스 후 원복
function fwClick(i){
  var fw=state.fw;
  if(!fw||fw.done||fw.found[i])return;
  var el=document.getElementById('fw-r-'+i);
  if(fw.diff[i]){
    fw.found[i]=1;fw.foundCnt++;
    if(el){el.setAttribute('style',fwCellStyle('r',i));el.classList.remove('sdk-pop');void el.offsetWidth;el.classList.add('sdk-pop');}
    var lel=document.getElementById('fw-l-'+i);
    if(lel)lel.setAttribute('style',fwCellStyle('l',i));
    var cnt=document.getElementById('fw-cnt');
    if(cnt)cnt.textContent=String(fw.foundCnt);
    fwMsg('');
    if(fw.foundCnt>=fw.total){
      fw.done=true;fw.doneSecs=Math.round((Date.now()-fw.startMs)/1000);
      var body=document.getElementById('fw-body');
      if(body)body.innerHTML=fwDoneHTML();
      if(state.session)lbSubmit('findwrong','',fw.doneSecs); // 게스트는 리더보드 제출 스킵
    }
  }else{
    if(el){el.classList.remove('sdk-bad');void el.offsetWidth;el.style.background='rgba(248,113,113,.22)';el.style.color='#F87171';el.classList.add('sdk-bad');}
    fwMsg('⚠ 그 칸은 양쪽이 같아요');
    setTimeout(function(){try{if(el){el.classList.remove('sdk-bad');el.setAttribute('style',fwCellStyle('r',i));}fwMsg('');}catch(e){}},480);
  }
}
function renderFindWrong(){
  if(!state.fw||!state.fw.left||state.fw.done)fwNew(); // 완료했거나 처음이면 새 판 (진행 중이면 유지)
  return '<div class="card"><div class="ttl" style="margin-bottom:3px">🔍 틀린 번호 찾기</div><div id="fw-sub" style="font-size:9px;color:#5A6A8E;margin-bottom:9px">위 원본과 다른 칸이 아래 비교판에 '+state.fw.total+'개 숨어 있어요 — 아래에서 찾아 누르세요!</div>'+lbBoxHTML('findwrong','')+'<div id="fw-body">'+fwBoardHTML()+'</div></div>'
    +'<div class="card cd" style="font-size:10px;color:#5A6A8E;line-height:1.8">1~45 로또 번호로 만든 5×5 그리드 두 개를 비교하는 순발력 게임이에요.<br>정답이면 초록, 아니면 빨강 — 전부 찾으면 걸린 시간이 표시됩니다. 매 판 새로 생성!</div>';
}

// ── 🃏 기억력 짝맞추기 (Phase 4) — 순수 클라이언트 게임 (findwrong과 동일 패턴, 서버 저장 없음) ──
// 1~45 로또 번호에서 난이도별 쌍 수만큼 뽑아 2장씩 섞어 배치 → 미리보기 후 전부 가리고 짝 찾기.
// 9×9는 81칸이 홀수라 40쌍(80칸)+⭐ 장식 1칸(이미 완성 취급, 클릭 불가)으로 구성.
var MM_CFG={
  e:{n:4,pairs:8,prev:4,cell:56,gap:6,fs:20,label:'4×4',sub:'8쌍 · 미리보기 4초'},
  m:{n:6,pairs:18,prev:6,cell:40,gap:4,fs:16,label:'6×6',sub:'18쌍 · 미리보기 6초'},
  h:{n:9,pairs:40,prev:9,cell:28,gap:2,fs:12,label:'9×9',sub:'40쌍+⭐ · 미리보기 9초'}
};
var MM_GEN=0; // 판 세대 — 이전 판의 setTimeout이 새 판을 건드리지 못하게 하는 무효화 토큰
function mmNew(lvl){
  var cfg=MM_CFG[lvl],pool=[],vals=[],i,r,t;
  for(i=1;i<=45;i++)pool.push(i);
  for(i=0;i<cfg.pairs;i++){r=i+Math.floor(Math.random()*(45-i));t=pool[i];pool[i]=pool[r];pool[r]=t;}
  for(i=0;i<cfg.pairs;i++){vals.push(pool[i]);vals.push(pool[i]);}
  if(cfg.n*cfg.n>cfg.pairs*2)vals.push(0); // 홀수 보드 보정 — 0=⭐ 장식 칸
  for(i=vals.length-1;i>0;i--){r=Math.floor(Math.random()*(i+1));t=vals[i];vals[i]=vals[r];vals[r]=t;}
  MM_GEN++;
  state.mm={lvl:lvl,cells:vals,matched:{},open:[],busy:false,preview:true,prevLeft:cfg.prev,matchedCnt:0,tries:0,startMs:0,done:false,doneSecs:0,gen:MM_GEN};
  mmTick(MM_GEN);
}
// 미리보기 카운트다운 — 1초 체인. 세대가 바뀌면(새 판/메뉴 복귀) 조용히 소멸
function mmTick(gen){
  setTimeout(function(){try{
    var mm=state.mm;
    if(!mm||mm.gen!==gen||!mm.preview||mm.done)return;
    mm.prevLeft--;
    if(mm.prevLeft<=0){mmHideAll();return;}
    var el=document.getElementById('mm-cd');
    if(el)el.textContent=mm.prevLeft+'초';
    mmTick(gen);
  }catch(e){}},1000);
}
function mmHideAll(){
  var mm=state.mm;
  if(!mm)return;
  mm.preview=false;mm.startMs=Date.now();
  var i;
  for(i=0;i<mm.cells.length;i++)mmPaint(i);
  var st=document.getElementById('mm-status');
  if(st)st.innerHTML=mmStatusHTML();
}
function mmOpenHas(i){var o=state.mm.open,j;for(j=0;j<o.length;j++)if(o[j]===i)return true;return false;}
function mmCellTxt(i){
  var mm=state.mm;
  if(mm.cells[i]===0)return '⭐';
  if(mm.preview||mm.matched[i]||mmOpenHas(i))return String(mm.cells[i]);
  return '';
}
// 공개 상태는 ZONES 구간색으로 로또 느낌 — 맞춘 쌍=초록 고정, 가림=무지 회색
function mmCellStyle(i){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  var s='width:'+cfg.cell+'px;height:'+cfg.cell+'px;border-radius:'+(cfg.n===9?6:9)+'px;display:flex;align-items:center;justify-content:center;font-size:'+cfg.fs+'px;font-weight:800;padding:0;border:none;';
  if(mm.cells[i]===0)return s+'background:rgba(251,191,36,.08);color:#FBBF24;box-shadow:inset 0 0 0 1px rgba(251,191,36,.3);';
  if(mm.matched[i])return s+'background:rgba(74,222,128,.18);color:#4ADE80;box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.6);';
  if(mm.preview||mmOpenHas(i)){var z=gz(mm.cells[i]);return s+'background:'+z.c+'26;color:'+z.c+';box-shadow:inset 0 0 0 1.5px '+z.c+'66;';}
  return s+'background:rgba(255,255,255,.07);color:rgba(255,255,255,0);';
}
function mmPaint(i){
  var el=document.getElementById('mm-c-'+i);
  if(!el)return;
  el.textContent=mmCellTxt(i);
  el.setAttribute('style',mmCellStyle(i));
}
function mmFlash(i,cls){var el=document.getElementById('mm-c-'+i);if(el){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}}
function mmStatusHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  if(mm.preview)return '<span style="color:#FBBF24">👀 숫자 위치를 기억하세요! <span id="mm-cd">'+mm.prevLeft+'초</span> 후 가려집니다</span>';
  return '<span style="color:#4ADE80">맞춘 쌍 <span id="mm-cnt">'+mm.matchedCnt+'</span> / '+cfg.pairs+'</span> <span style="color:#5A6A8E;font-weight:400">· 시도 <span id="mm-try">'+mm.tries+'</span>회</span>';
}
function mmBoardHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl],html='',r,c,i;
  for(r=0;r<cfg.n;r++){
    html+='<div style="display:flex;gap:'+cfg.gap+'px;justify-content:center;margin-top:'+(r?cfg.gap:0)+'px">';
    for(c=0;c<cfg.n;c++){
      i=r*cfg.n+c;
      html+='<button id="mm-c-'+i+'" onclick="mmClick('+i+')" style="'+mmCellStyle(i)+'">'+mmCellTxt(i)+'</button>';
    }
    html+='</div>';
  }
  return html+'<div id="mm-status" style="text-align:center;margin-top:11px;font-size:11px;font-weight:800">'+mmStatusHTML()+'</div>';
}
// 클릭한 셀만 국소 갱신 — 두 장 공개 후 판정 중(busy)엔 세 번째 클릭 무시
function mmClick(i){
  var mm=state.mm;
  if(!mm||mm.done||mm.busy||mm.preview)return;
  if(mm.cells[i]===0||mm.matched[i]||mmOpenHas(i))return;
  mm.open.push(i);
  mmPaint(i);
  if(mm.open.length<2)return;
  mm.tries++;
  var te=document.getElementById('mm-try');
  if(te)te.textContent=String(mm.tries);
  var a=mm.open[0],b=mm.open[1];
  if(mm.cells[a]===mm.cells[b]){
    mm.matched[a]=1;mm.matched[b]=1;mm.matchedCnt++;mm.open=[];
    mmPaint(a);mmPaint(b);mmFlash(a,'sdk-pop');mmFlash(b,'sdk-pop');
    var ce=document.getElementById('mm-cnt');
    if(ce)ce.textContent=String(mm.matchedCnt);
    if(mm.matchedCnt>=MM_CFG[mm.lvl].pairs){
      mm.done=true;mm.doneSecs=Math.round((Date.now()-mm.startMs)/1000);
      var body=document.getElementById('mm-body');
      if(body)body.innerHTML=mmDoneHTML();
      if(state.session)lbSubmit('memory',MM_TIER[mm.lvl],mm.doneSecs); // 게스트는 리더보드 제출 스킵
    }
  }else{

  sb.from('draws').select('round,won1_count,won1_amount').order('round',{ascending:false}).limit(1)

    });

function loadDraws(cb){
  if(state.draws){cb();return;}
  var all=[];
  function page(from){
    sb.from('draws').select('round,n1,n2,n3,n4,n5,n6,bonus,drawn_date,won1_count,won1_amount,won2_count,won2_amount,won3_count,won3_amount,won4_count,won4_amount,won5_count,won5_amount').order('round',{ascending:false}).range(from,from+999)
      .then(function(res){
        if(res.error){showErr('데이터 조회 실패: '+res.error.message);return;}
        all=all.concat(res.data||[]);
        if(res.data&&res.data.length===1000)page(from+1000);
        else{
          state.draws=all;
          var eT=document.getElementById('h-total');
          if(eT&&all.length)eT.textContent=fmtNum(all.length);
          cb();
        }
      });
  }
  page(0);
}

function renderHot(){
  if(!state.draws)return needDraws('hot');
  var N=state.draws.length,rF={},ls={},sums=[],evenTot=0;
  for(var n=1;n<=45;n++){rF[n]=0;ls[n]=N;}
  for(var i=0;i<N;i++){
    var nn=drawNums(state.draws[i]),sum=0;
    for(var j=0;j<6;j++){
      var n=nn[j];sum+=n;if(n%2===0)evenTot++;
      if(i<10)rF[n]++;
      if(ls[n]===N)ls[n]=i;
    }
    sums.push(sum);
  }
  var avgEven=evenTot/N,avgSum=0;for(var i=0;i<N;i++)avgSum+=sums[i];avgSum/=N;
  var hot='',hs=[];
  for(var n=1;n<=45;n++)if(rF[n]>=2)hs.push([n,rF[n]]);
  hs.sort(function(a,b){return b[1]-a[1];});
  for(var i=0;i<hs.length;i++)hot+='<div style="text-align:center">'+ballHTML(hs[i][0],38,true,0)+'<div style="font-size:9px;color:#F97316;margin-top:3px;font-weight:700">'+hs[i][1]+'회</div></div>';
  if(!hot)hot='<div style="font-size:11px;color:#5A6A8E">해당 없음</div>';
  var cold='',lsS=[];
  for(var n=1;n<=45;n++)lsS.push([n,ls[n]]);
  lsS.sort(function(a,b){return b[1]-a[1];});
  for(var i=0;i<15;i++)cold+='<div style="text-align:center">'+ballHTML(lsS[i][0],36,false,0)+'<div style="font-size:9px;color:#38BDF8;margin-top:3px">'+lsS[i][1]+'회전</div></div>';
  var mn=Math.min.apply(null,sums),mxs=Math.max.apply(null,sums);

function admFindUser(id){
  var us=(state.admin&&state.admin.users)||[];
  for(var i=0;i<us.length;i++){if(us[i].id===id)return us[i];}
  return null;
}
function admAct(action,targetId,value){
  if(state.admActBusy)return;
  state.admActBusy=true;
  var body={action:action,targetId:targetId};
  if(value!==undefined&&value!==null)body.value=value;
  fetch(SB_URL+'/functions/v1/admin',{method:'POST',headers:{'Authorization':'Bearer '+(state.session?state.session.access_token:SB_ANON),'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){
      state.admActBusy=false;
      if(j&&j.ok){state.admin=null;loadAdmin();if(state.tab==='adm')doTab('adm');}
      else{showErr((j&&j.error)||'처리 실패');if(state.tab==='adm')doTab('adm');}
    })
    .catch(function(e){state.admActBusy=false;showErr('서버 연결 실패: '+e.message);});
}
function admSetLevel(id,sel){
  var u=admFindUser(id);
  var v=parseInt(sel.value,10);
  if(!u||!v||v===u.level)return;
  if(window.confirm(u.email+' 레벨을 Lv.'+u.level+' → Lv.'+v+' 로 변경할까요?'))admAct('set_level',id,v);
  else if(state.tab==='adm')doTab('adm');
}
function admResetAttend(id){
  var u=admFindUser(id);
  if(!u)return;
  if(window.confirm(u.email+' 의 연속 출석을 초기화할까요? (레벨 유지)'))admAct('reset_attend',id);
}
function admDelUser(id){
  var u=admFindUser(id);

}

    c.innerHTML=recCard+html+'<div class="footer">⚠️ 통계 패턴 분석이며 실제 당첨을 보장하지 않습니다<br>로또 6/45 당첨확률 1/8,145,060</div>';
    if(!locked&&(id==='freq'||id==='hist'||id==='hot'||id==='prem')&&!state.draws)loadDraws(function(){if(state.tab===id)doTab(id);});
    if(!locked&&id==='rec'&&state.latestWin===null)loadLatestWin(function(){
      try{
        if(state.tab!=='rec')return;
        var el=document.getElementById('rec-win-fact');
        if(el)el.innerHTML=latestWinCardHTML();
      }catch(e){}
    });
  }catch(e){showErr('렌더 오류: '+e.message);}
}

// ── 인증 ──
function openAuth(){
  state.authMode='login';syncAuthUI();
  var saved='';try{saved=localStorage.getItem('lotto-last-email')||'';}catch(e){}
  var em=document.getElementById('auth-email');if(em&&!em.value&&saved)em.value=saved;
  syncOAuthButtons();
  document.getElementById('auth-modal').style.display='block';
}
function syncOAuthButtons(){
  var g=document.getElementById('oauth-google'),k=document.getElementById('oauth-kakao');
  if(g){if(state.providers.google){g.style.opacity='1';g.innerHTML='G&nbsp; 구글로 계속하기';}else{g.style.opacity='.45';g.innerHTML='G&nbsp; 구글 로그인 (준비 중)';}}
  if(k){if(state.providers.kakao){k.style.opacity='1';k.innerHTML='💬 카카오로 계속하기';}else{k.style.opacity='.45';k.innerHTML='💬 카카오 로그인 (준비 중)';}}
}
function closeAuth(){document.getElementById('auth-modal').style.display='none';document.getElementById('auth-msg').textContent='';}
function toggleAuthMode(){state.authMode=state.authMode==='login'?'signup':'login';syncAuthUI();}
function syncAuthUI(){
  var lg=state.authMode==='login';
  document.getElementById('auth-title').textContent=lg?'로그인':'회원가입';
  document.getElementById('auth-submit').textContent=lg?'로그인':'가입하기';
  document.getElementById('auth-toggle').textContent=lg?'처음이신가요? 회원가입':'이미 계정이 있나요? 로그인';
  document.getElementById('auth-msg').textContent='';
}
function authErrKo(m){
  if(!m)return '오류가 발생했습니다.';
  if(m.indexOf('Invalid login credentials')>=0)return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if(m.indexOf('already registered')>=0)return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if(m.indexOf('at least 6')>=0)return '비밀번호는 6자 이상이어야 합니다.';
  if(m.indexOf('valid email')>=0||m.indexOf('invalid format')>=0)return '올바른 이메일 주소를 입력해 주세요.';
  if(m.indexOf('rate limit')>=0||m.indexOf('Too many')>=0)return '시도가 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
  return m;
}
function doAuth(){
  var email=document.getElementById('auth-email').value.trim();
  var pw=document.getElementById('auth-pw').value;
  var msg=document.getElementById('auth-msg');
  if(!email||pw.length<6){msg.textContent='이메일과 6자 이상 비밀번호를 입력하세요.';return;}
  msg.style.color='#7080A0';msg.textContent='처리 중...';
  var p=state.authMode==='login'?sb.auth.signInWithPassword({email:email,password:pw}):sb.auth.signUp({email:email,password:pw});
  p.then(function(res){
    if(res.error){msg.style.color='#F87171';msg.textContent=authErrKo(res.error.message);return;}
    try{
      var rm=document.getElementById('auth-remember');
      if(rm&&rm.checked)localStorage.setItem('lotto-last-email',email);
      else localStorage.removeItem('lotto-last-email');
    }catch(e){}
    closeAuth();
  });
}
function doRecover(){
  var email=document.getElementById('auth-email').value.trim();
  var msg=document.getElementById('auth-msg');
  if(!email){msg.style.color='#FBBF24';msg.textContent='가입한 이메일을 입력한 뒤 다시 눌러주세요.';return;}
  msg.style.color='#7080A0';msg.textContent='재설정 메일 발송 중...';
  sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname})
    .then(function(res){
      if(res.error){msg.style.color='#F87171';msg.textContent=authErrKo(res.error.message);return;}
      msg.style.color='#4ADE80';msg.textContent='재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인하세요.';
    });
}
function setNewPw(){
  var pw=document.getElementById('new-pw').value;
  var msg=document.getElementById('new-pw-msg');
  if(pw.length<6){if(msg)msg.textContent='6자 이상 입력하세요.';return;}
  sb.auth.updateUser({password:pw}).then(function(res){
    if(res.error){if(msg)msg.textContent=authErrKo(res.error.message);return;}
    state.recovery=false;state.notice='✅ 비밀번호가 변경되었습니다. 다음부터 이메일+비밀번호로 로그인하세요.';
    doTab('rec');
  });
}
function doOAuth(provider){
  var msg=document.getElementById('auth-msg');
  if(!state.providers[provider]){
    if(msg){msg.style.color='#FBBF24';msg.textContent=(provider==='google'?'구글':'카카오')+' 로그인은 준비 중입니다. 이메일로 가입해 주세요.';}
    return;
  }
  sb.auth.signInWithOAuth({provider:provider,options:{redirectTo:window.location.origin+window.location.pathname}})
    .then(function(res){
      if(res.error&&msg){msg.style.color='#F87171';msg.textContent='소셜 로그인 실패: '+res.error.message;}
    });
}
function doLogout(){sb.auth.signOut();state.rec=null;state.admin=null;state.notice='';state.streak=0;state.toNext=null;state.myPicks=null;state.savedKeys={};}

function loadProfile(cb){
  if(!state.session){state.level=0;state.streak=0;state.toNext=null;cb();return;}
  sb.from('profiles').select('level,streak').eq('id',state.session.user.id).single()
    .then(function(res){
      if(res.data){state.level=typeof res.data.level==='number'?res.data.level:1;state.streak=res.data.streak||0;}
      else state.level=1;
      cb();
    });
}
function envAllowed(){
  if(APP_ENV==='qa')return state.level===99||state.level===100;
  if(APP_ENV==='dev')return state.level===100;
  return true;
}
function trackVisit(){
  if(APP_ENV!=='live')return;
  var vd=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
  var vk=vd+':'+(state.session?state.session.user.id:'guest');
  if(state.vKey===vk)return;
  state.vKey=vk;
  try{
    var vid=localStorage.getItem('lotto-vid');
    if(!vid){
      vid='v'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,12);
      localStorage.setItem('lotto-vid',vid);
    }
    fetch(SB_URL+'/rest/v1/rpc/track_visit',{method:'POST',headers:{'apikey':SB_ANON,'Authorization':'Bearer '+(state.session?state.session.access_token:SB_ANON),'Content-Type':'application/json'},body:JSON.stringify({vid:vid})}).catch(function(e){});
  }catch(e){}
}
function doCheckin(){
  if(APP_ENV!=='live')return;
  if(!state.session)return;
  fetch(SB_URL+'/functions/v1/checkin',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token}})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&typeof j.level==='number'){
        var changed=(state.level!==j.level||state.streak!==j.streak||state.toNext!==j.toNext);
        state.level=j.level;state.streak=j.streak;state.toNext=j.toNext;
        if(j.leveledUp)state.notice='🎉 레벨 업! '+(j.level===100?'마스터':'Lv.'+j.level+' '+lvInfo(j.level).name)+' 달성!';
        else if(j.leveledDown)state.notice='😢 연속 출석이 끊겨 Lv.'+j.level+' '+lvInfo(j.level).name+'(으)로 조정됐어요. 다시 시작!';
        if(changed||j.leveledUp||j.leveledDown){renderAcct();doTab(state.tab);}
      }
    })
    .catch(function(e){});
}

// ── 부트스트랩 ──
function refresh(){renderAcct();renderTabs();doTab(state.tab);}
var _lastUid=null;
sb.auth.onAuthStateChange(function(ev,session){
  if(ev==='PASSWORD_RECOVERY')state.recovery=true;
  var newUid=session?session.user.id:null;
  var identityChanged=(newUid!==_lastUid);
  state.session=session;_lastUid=newUid;
  if(identityChanged){
    state.rec=null;state.mode='wide';state.admin=null;state.myPicks=null;state.savedKeys={};state.sdk.st=null;state.lb={};
    loadProfile(function(){refresh();trackVisit();if(session){doCheckin();loadSdkStatus();}});
  }else if(session){
    doCheckin();loadSdkStatus();
  }
});
try{
  var _vb=document.getElementById('ver-badge');if(_vb)_vb.textContent='v'+APP_VERSION+(APP_ENV!=='live'?' · '+APP_ENV.toUpperCase():'');
  if(APP_ENV!=='live'){
    var _es=document.getElementById('app-env');
    if(_es){
      _es.style.display='inline-block';
      _es.textContent=APP_ENV.toUpperCase();
      if(APP_ENV==='qa'){_es.style.color='#FBBF24';_es.style.background='rgba(251,191,36,.15)';_es.style.border='1px solid rgba(251,191,36,.4)';}
      else{_es.style.color='#F87171';_es.style.background='rgba(248,113,113,.15)';_es.style.border='1px solid rgba(248,113,113,.4)';}
    }
    document.title='['+APP_ENV.toUpperCase()+'] '+document.title;
  }
}catch(e){}
fetch(SB_URL+'/auth/v1/settings',{headers:{apikey:SB_ANON}})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j&&j.external){state.providers.google=!!j.external.google;state.providers.kakao=!!j.external.kakao;}
    syncOAuthButtons();
  }).catch(function(e){});
try{
  if(window.location.hash&&window.location.hash.indexOf('error')>=0){
    var _hm=window.location.hash.match(/error_description=([^&]+)/);
    openAuth();
    var _am=document.getElementById('auth-msg');
    if(_am){_am.style.color='#F87171';_am.textContent='소셜 로그인 실패: '+(_hm?decodeURIComponent(_hm[1].replace(/\+/g,' ')):'설정을 확인해 주세요');}
    history.replaceState(null,'',window.location.pathname);
  }
}catch(e){}
sb.auth.getSession().then(function(res){
  state.session=res.data?res.data.session:null;
  loadProfile(function(){
    refresh();
    trackVisit();
    if(state.session){doCheckin();loadSdkStatus();}
    var exp=Math.floor((Date.now()-1039264200000)/604800000)+1;
    var eN=document.getElementById('h-next');if(eN)eN.textContent=exp+1;
    loadDraws(function(){
      var eN2=document.getElementById('h-next');
      if(eN2&&state.draws&&state.draws.length){
        var latest=state.draws[0].round;
        eN2.textContent=(exp>latest?exp:latest)+1;
      }
      if(state.tab==='freq'||state.tab==='hist'||state.tab==='hot')doTab(state.tab);
    });
  });
});
</script>

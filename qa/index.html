function fmtWon(x){
  var n=Number(x);
  if(x===null||x===undefined||!isFinite(n)||n<=0)return '-';
  if(n>=100000000){var e=Math.floor(n/100000000),m=Math.floor(n%100000000/10000);return fmtNum(e)+'억'+(m>0?fmtNum(m)+'만':'')+'원';}
  if(n>=10000)return fmtNum(Math.floor(n/10000))+'만원';
  if(n>=1000)return Math.floor(n/1000)+'천원';
  return fmtNum(n)+'원';
}
function maskEmail(email){
  if(!email)return '';
  var s=String(email);
  var at=s.indexOf('@');
  var local=at>-1?s.slice(0,at):s;
  var domain=at>-1?s.slice(at):'';
  var keep=local.length>=6?3:local.length>=3?2:1;
  return local.slice(0,keep)+'***'+domain;
}

function getRec(){
  if(state.recBusy)return;
  state.recBusy=true;doTab('rec');
  var tok=state.session?state.session.access_token:SB_ANON;
  fetch(SB_URL+'/functions/v1/recommend?mode='+state.mode,{headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(j){
      state.recBusy=false;
      if(j&&j.sets)state.rec=j;
      else showErr((j&&j.error)||'추천 실패');
      doTab('rec');
    })
    .catch(function(e){state.recBusy=false;showErr('서버 연결 실패: '+e.message);doTab('rec');});
}
function setMode(w){state.mode=w?'wide':'focus';state.rec=null;doTab('rec');}
function toggleHelp(id){

function calcNextRound(){
  var exp=Math.floor((Date.now()-1039264200000)/604800000)+1;
  var latest=(state.draws&&state.draws.length)?state.draws[0].round:0;
  return (exp>latest?exp:latest)+1;
}
function pickToast(msg){
  var t=document.getElementById('pick-toast');
  if(!t)return;
  t.textContent=msg;t.style.display='block';
  try{setTimeout(function(){try{t.style.display='none';}catch(e){}},2600);}catch(e){}
}
function saveBtnHTML(round,nums,source,btnId){
  var key=round+':'+nums.join(',');
  if(state.savedKeys[key])return '<span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">✓ 저장됨</span>';
  return '<button class="tag"'+(btnId?' id="'+btnId+'"':'')+' onclick="savePick(this,'+round+',\''+nums.join(',')+'\',\''+source+'\')" style="color:#E8A93A;background:rgba(232,169,58,.12);border:1px solid rgba(232,169,58,.3)">💾 저장</button>';
}
function savePick(btn,round,csv,source,cb){
  // cb: 일괄 저장(qrSaveAll)용 완료 콜백(성공 여부 전달) — 인라인 onclick 호출 시엔 undefined
  if(!state.session){pickToast('로그인하면 번호를 저장하고 당첨 결과를 자동으로 확인할 수 있어요');openAuth();if(cb){try{cb(false);}catch(e0){}}return;}
  if(state.saveBusy){if(cb){try{cb(false);}catch(e0){}}return;}
  state.saveBusy=true;
  var parts=csv.split(','),nums=[];
  for(var i=0;i<parts.length;i++)nums.push(parseInt(parts[i],10));
  fetch(SB_URL+'/functions/v1/picks',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'save',round:round,numbers:nums,source:source})})
    .then(function(r){return r.json();})
    .then(function(j){
      state.saveBusy=false;
      var ok=!!(j&&j.ok);
      if(ok){state.savedKeys[round+':'+csv]=true;state.myPicks=null;btn.outerHTML='<span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">✓ 저장됨</span>';pickToast('✅ 제'+round+'회에 저장 ('+j.count+'/50) — 결과는 내정보 탭에서 자동 확인');}
      else pickToast('⚠ '+((j&&j.error)||'저장 실패'));
      if(cb){try{cb(ok);}catch(e1){}}
    })
    .catch(function(e){state.saveBusy=false;pickToast('⚠ 서버 연결 실패: '+e.message);if(cb){try{cb(false);}catch(e2){}}});
}

  fetch(SB_URL+'/functions/v1/picks',{headers:{'Authorization':'Bearer '+state.session.access_token}})
    .then(function(r){return r.json();})
    .then(function(j){state.picksBusy=false;if(j&&j.ok)state.myPicks=j;if(state.tab==='me'||state.tab==='histmatch')doTab(state.tab);})

function deletePick(id){
  if(!state.session)return;
  if(!window.confirm('이 저장 번호를 삭제할까요?'))return;
  fetch(SB_URL+'/functions/v1/picks',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:id})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.ok){
        var mp=state.myPicks,i;
        if(mp&&mp.picks){for(i=0;i<mp.picks.length;i++){if(mp.picks[i].id===id){mp.picks.splice(i,1);break;}}}
        var wrap=document.getElementById('mypicks-wrap');
        if(wrap)wrap.innerHTML=renderMyPicks();
      }
      else pickToast('⚠ '+((j&&j.error)||'삭제 실패'));
    })
    .catch(function(e){pickToast('⚠ 서버 연결 실패');});
}
function pickRank(m,b){
  if(m===6)return['🥇 1등!','#E8A93A'];

  if(m===5)return['🥉 3등!','#F97316'];
  if(m===4)return['4등','#4ADE80'];

}

var qrStream=null,qrTimer=null,qrActive=false;

var QR_GUIDE_TEXT='로또 용지 하단의 QR코드를 가이드 박스 안에 맞춰주세요 · 초점이 안 맞으면 화면을 탭하세요';
function parseLottoQR(raw){
  if(!raw)return null;
  var m=String(raw).match(/[?&]v=([0-9a-zA-Z]+)/);
  if(!m)return null;
  var s=m[1];
  if(s.length<17)return null;
  var round=parseInt(s.slice(0,4),10);
  if(!isFinite(round)||round<1)return null;
  var rest=s.slice(4),games=[],re=/[a-zA-Z](\d{12})/g,g,skipped=0;
  while((g=re.exec(rest))!==null&&games.length<5){
    var d=g[1],nums=[],ok=true,seen={},i,n;
    for(i=0;i<6;i++){
      n=parseInt(d.slice(i*2,i*2+2),10);
      if(!(n>=1&&n<=45)||seen[n]){ok=false;break;}
      seen[n]=true;nums.push(n);
    }
    if(ok&&nums.length===6)games.push(nums);else skipped++;
  }
  if(!games.length)return null;
  return {round:round,games:games,skipped:skipped};
}
function qrLevelLocked(){return state.level===100?false:(effLv()<2);}
function openQrScan(){
  if(!state.session){pickToast('로그인하면 QR로 번호를 넣을 수 있어요');openAuth();return;}
  if(qrLevelLocked()){pickToast('🔒 Lv.2 실버부터 사용할 수 있어요 — 연속 출석으로 승급하세요!');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pickToast('⚠ 이 브라우저는 카메라를 지원하지 않습니다');return;}
  if(!window.jsQR){pickToast('⚠ QR 인식 모듈을 아직 불러오는 중입니다. 잠시 후 다시 시도해 주세요');return;}
  var md=document.getElementById('qr-modal');if(!md)return;
  md.style.display='block';
  document.getElementById('qr-result').innerHTML='';
  document.getElementById('qr-video-wrap').style.display='block';
  document.getElementById('qr-status').textContent='카메라 준비 중...';
  qrActive=true;
  // 탭하면 재포커스 — 비디오 영역 탭 시 초점 재시도(한 번만 바인딩)
  var vwrap=document.getElementById('qr-video-wrap');
  if(vwrap&&!qrRefocusBound){qrRefocusBound=true;try{vwrap.addEventListener('click',qrRefocus);}catch(eb){}}
  var onStream=function(stream){
    if(!qrActive){var ts=stream.getTracks();for(var i=0;i<ts.length;i++){try{ts[i].stop();}catch(e){}}return;}
    qrStream=stream;
    var v=document.getElementById('qr-video');
    if(v){v.srcObject=stream;try{v.play();}catch(e2){}}
    var st=document.getElementById('qr-status');
    if(st)st.textContent=QR_GUIDE_TEXT;
    qrTick();
  };
  var onFail=function(e){
    var st2=document.getElementById('qr-status');
    if(st2)st2.textContent='⚠ 카메라를 열 수 없습니다. 브라우저 설정에서 카메라 권한을 허용한 뒤 다시 시도해 주세요.';
  };
  qrAcquireStream(onStream,onFail);
}
// 후면 카메라 스트림 획득(2단계 폴백) — openQrScan·qrRefocus 공용.
// 1차: 후면 카메라 고해상도 + 연속 초점. 일부 기기가 세밀한 제약을 거부(OverconstrainedError)하면 2차로 폴백.
function qrAcquireStream(onOk,onErr){
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},advanced:[{focusMode:'continuous'}]}})
    .then(onOk)
    .catch(function(e){
      navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
        .then(onOk)
        .catch(onErr);
    });
}
// 탭하면 재포커스 — 네이티브 focus API(Android 등) + 스트림 재시작(iOS Safari 등) 이중 처리
function qrRefocus(evt){
  try{
    var now=Date.now();
    if(now-qrRefocusTs<900)return; // 쿨다운
    qrRefocusTs=now;
    // 탭 지점 시각 피드백(골드 링이 살짝 커지며 페이드아웃)
    var wrap=document.getElementById('qr-video-wrap');
    if(wrap&&evt){
      try{
        var rc=wrap.getBoundingClientRect();
        var rx=evt.clientX-rc.left,ry=evt.clientY-rc.top;
        var ring=document.createElement('div');
        ring.style.cssText='position:absolute;left:'+rx+'px;top:'+ry+'px;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid #E8A93A;border-radius:50%;pointer-events:none;opacity:.9;transform:scale(.5);transition:transform .5s ease-out,opacity .5s ease-out;z-index:2';
        wrap.appendChild(ring);
        setTimeout(function(){try{ring.style.transform='scale(1.25)';ring.style.opacity='0';}catch(e){}},10);
        setTimeout(function(){try{if(ring.parentNode)ring.parentNode.removeChild(ring);}catch(e){}},560);
      }catch(e0){}
    }
    // 상태 텍스트 임시 변경 후 원복
    var st=document.getElementById('qr-status');
    if(st)st.textContent='초점 맞추는 중...';
    setTimeout(function(){try{var s2=document.getElementById('qr-status');if(s2&&qrActive)s2.textContent=QR_GUIDE_TEXT;}catch(e){}},800);
    // a) 네이티브 focus API 시도(지원 기기)
    try{
      if(qrStream){
        var track=qrStream.getVideoTracks()[0];
        if(track&&track.getCapabilities){
          try{
            var caps=track.getCapabilities();
            var fm=(caps&&caps.focusMode)||[];
            var mode=null,fi;
            for(fi=0;fi<fm.length;fi++){if(fm[fi]==='single-shot'){mode='single-shot';break;}}
            if(!mode){for(fi=0;fi<fm.length;fi++){if(fm[fi]==='continuous'){mode='continuous';break;}}}
            if(mode&&track.applyConstraints)track.applyConstraints({advanced:[{focusMode:mode}]}).catch(function(e){});
          }catch(eA){}
        }
      }
    }catch(eA2){}
    // b) 스트림 재시작(focus API 없는 브라우저 대응) — qrTick 폴링 루프는 그대로 두고 스트림만 교체
    try{
      var oldStream=qrStream;
      qrAcquireStream(function(ns){
        try{
          if(!qrActive){var t0=ns.getTracks();for(var k0=0;k0<t0.length;k0++){try{t0[k0].stop();}catch(e){}}return;}
          if(oldStream){var to=oldStream.getTracks();for(var k=0;k<to.length;k++){try{to[k].stop();}catch(e){}}}
          qrStream=ns;
          var v=document.getElementById('qr-video');
          if(v){v.srcObject=ns;try{v.play();}catch(e){}}
        }catch(eOk){}
      },function(e){});
    }catch(eB){}
  }catch(eOut){}
}
var qrTickN=0;
function qrTick(){
  try{
    if(!qrActive||!qrStream)return;
    var v=document.getElementById('qr-video');
    if(v&&v.readyState>=2&&v.videoWidth>0){
      qrTickN++;
      var vw=v.videoWidth,vh=v.videoHeight;
      // 가이드 박스(화면 폭의 62% 정사각형)에 대응하는 실제 프레임 픽셀 영역만 크롭.
      // 짧은 변 기준 62%를 정사각형으로 중앙에서 잘라 canvas 전체에 그려 픽셀 밀도를 높인다.
      var side=Math.floor(Math.min(vw,vh)*0.62);
      if(side<1)side=Math.min(vw,vh);
      var sx=Math.floor((vw-side)/2),sy=Math.floor((vh-side)/2);
      var cv=document.getElementById('qr-canvas');
      var ctx=cv.getContext('2d');
      var code=null;
      // 1) 중앙 크롭 영역 디코딩(확대 효과)
      cv.width=side;cv.height=side;
      ctx.drawImage(v,sx,sy,side,side,0,0,side,side);
      var img=ctx.getImageData(0,0,side,side);
      try{code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});}catch(e1){}
      // 2) 크롭 실패 시, 매 3번째 tick마다 전체 프레임도 시도(가이드 밖 QR 폴백)
      if((!code||!code.data)&&(qrTickN%3===0)){
        cv.width=vw;cv.height=vh;
        ctx.drawImage(v,0,0,vw,vh);
        var img2=ctx.getImageData(0,0,vw,vh);
        try{code=window.jsQR(img2.data,img2.width,img2.height,{inversionAttempts:'attemptBoth'});}catch(e3){}
      }
      if(code&&code.data){
        var parsed=parseLottoQR(code.data);
        if(parsed){qrFound(parsed);return;}
        var st=document.getElementById('qr-status');
        if(st)st.textContent='로또 용지 QR이 아닌 것 같아요 — 용지 하단의 QR코드를 비춰주세요';
      }
    }
    qrTimer=setTimeout(qrTick,250);
  }catch(e){try{qrTimer=setTimeout(qrTick,400);}catch(e2){}}
}
var qrLastParsed=null,qrBatchBusy=false;
function qrFound(parsed){
  stopQrStream();
  qrLastParsed=parsed;
  var vw=document.getElementById('qr-video-wrap');
  if(vw)vw.style.display='none';
  var st=document.getElementById('qr-status');
  if(st)st.textContent='제'+parsed.round+'회 추첨 여부 확인 중...';
  // 이미 추첨된(과거) 회차인지 단건 조회로 판단 — 있으면 즉시 결과 확인, 없으면(미래 회차) 기존 저장 흐름
  sb.from('draws').select('round,n1,n2,n3,n4,n5,n6,bonus').eq('round',parsed.round).maybeSingle()
    .then(function(res){
      var draw=(res&&!res.error&&res.data)?res.data:null;
      if(draw)qrShowPastResult(parsed,draw);
      else qrShowSaveList(parsed);
    },function(){qrShowSaveList(parsed);});
}
// 과거 회차: 저장 없이 당첨번호와 클라이언트에서 직접 대조해 즉시 결과 표시
function qrShowPastResult(parsed,draw){
  var st=document.getElementById('qr-status');
  if(st)st.textContent='';
  var wn=[draw.n1,draw.n2,draw.n3,draw.n4,draw.n5,draw.n6],wset={},i,k;
  for(i=0;i<6;i++)wset[wn[i]]=true;
  var html='<div style="font-size:12px;font-weight:800;color:#E8A93A;margin-bottom:6px">🏁 제'+parsed.round+'회는 이미 추첨이 끝났어요 — 결과 바로 확인!</div>';
  if(parsed.skipped)html+='<div style="font-size:11px;color:#F97316;margin-bottom:6px">⚠ 일부 게임('+parsed.skipped+'개)은 번호를 읽지 못해 제외했어요</div>';
  var wb='';for(i=0;i<6;i++)wb+=ballHTML(wn[i],22,false,0);
  html+='<div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;padding:6px 0;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)"><span style="font-size:11px;color:#8A8A93;margin-right:2px">당첨번호</span>'+wb+'<span style="color:#8A8A93;font-size:11px;margin:0 1px">+</span>'+ballHTML(draw.bonus,22,false,0)+'</div>';
  for(i=0;i<parsed.games.length;i++){
    var nums=parsed.games[i],bls='',m=0,b=false;
    for(k=0;k<nums.length;k++){
      var hit=!!wset[nums[k]];
      if(hit)m++;
      if(nums[k]===draw.bonus)b=true;
      if(hit)bls+=ballHTML(nums[k],24,true,0);
      else bls+=ballHTML(nums[k],24,false,0,'#8A8A93');
    }
    var rk=pickRank(m,b);
    var sub=(m>=3)?(m+'개 일치'+(m===5&&b?' + 보너스':'')):(m+'개 일치 — 5등(3개)에는 못 미쳐요');
    html+='<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)"><div style="display:flex;gap:3px;flex-wrap:wrap;flex:1">'+bls+'</div><div style="flex-shrink:0;text-align:right"><div style="font-size:11px;font-weight:800;color:'+rk[1]+'">'+rk[0]+'</div><div style="font-size:10px;color:#8A8A93">'+sub+'</div></div></div>';
  }
  html+='<div style="font-size:11px;color:#8A8A93;line-height:1.7;margin-top:10px">이미 추첨된 회차라 저장 없이 결과만 보여드려요.<br>실제 당첨 확인·수령은 동행복권 공식 채널을 이용해 주세요.</div>';
  html+='<button onclick="openQrScan()" style="width:100%;margin-top:12px;padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:none;color:#8A8A93;font-size:12px">📷 다시 스캔</button>';
  var res=document.getElementById('qr-result');
  if(res)res.innerHTML=html;
}
// 미래 회차: 기존 저장 흐름(게임별 저장 버튼) + 상단 전체 저장 버튼
function qrShowSaveList(parsed){
  var st=document.getElementById('qr-status');
  if(st)st.textContent='';
  var html='<div style="font-size:12px;font-weight:800;color:#E8A93A;margin-bottom:8px">✅ 제'+parsed.round+'회 · '+parsed.games.length+'게임 인식됨</div>';
  if(parsed.skipped)html+='<div style="font-size:11px;color:#F97316;margin-bottom:8px">⚠ 일부 게임('+parsed.skipped+'개)은 번호를 읽지 못해 제외했어요</div>';
  var unsaved=0,i,k;
  for(i=0;i<parsed.games.length;i++)if(!state.savedKeys[parsed.round+':'+parsed.games[i].join(',')])unsaved++;
  if(unsaved>0)html+='<div style="text-align:right;margin-bottom:4px"><button id="qr-saveall" class="tag" onclick="qrSaveAll()" style="color:#171207;background:#E8A93A;border:none;font-weight:800;padding:6px 14px">💾 전체 저장 ('+unsaved+'게임)</button></div>';
  else if(parsed.games.length>1)html+='<div style="text-align:right;margin-bottom:4px"><span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">✓ 전체 저장됨</span></div>';
  for(i=0;i<parsed.games.length;i++){
    var nums=parsed.games[i],bls='';
    for(k=0;k<nums.length;k++)bls+=ballHTML(nums[k],24,false,0);
    html+='<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)"><div style="display:flex;gap:3px;flex-wrap:wrap;flex:1">'+bls+'</div><div style="flex-shrink:0">'+saveBtnHTML(parsed.round,nums,'qr','qr-sv-'+i)+'</div></div>';
  }
  html+='<div style="font-size:11px;color:#8A8A93;line-height:1.7;margin-top:10px">저장하면 추첨 후 결과가 자동으로 대조됩니다.<br>실제 당첨 확인은 동행복권 공식 채널에서도 가능합니다.</div>';
  html+='<button onclick="openQrScan()" style="width:100%;margin-top:12px;padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:none;color:#8A8A93;font-size:12px">📷 다시 스캔</button>';
  var res=document.getElementById('qr-result');
  if(res)res.innerHTML=html;
}
// 전체 저장 — 아직 저장 안 된 게임만 기존 savePick을 순차 호출(하나 실패해도 계속 진행)
function qrSaveAll(){
  if(qrBatchBusy||!qrLastParsed)return;
  if(!state.session){pickToast('로그인하면 번호를 저장하고 당첨 결과를 자동으로 확인할 수 있어요');openAuth();return;}
  var p=qrLastParsed,items=[],i;
  for(i=0;i<p.games.length;i++)if(!state.savedKeys[p.round+':'+p.games[i].join(',')])items.push(i);
  var allBtn=document.getElementById('qr-saveall');
  if(!items.length){if(allBtn)allBtn.outerHTML='<span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">✓ 전체 저장됨</span>';return;}
  qrBatchBusy=true;
  if(allBtn)allBtn.disabled=true;
  var total=items.length,okCnt=0,failCnt=0;
  function step(idx){
    var b=document.getElementById('qr-saveall');
    if(idx>=total){
      qrBatchBusy=false;
      if(b){
        if(failCnt===0)b.outerHTML='<span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">✓ 전체 저장됨</span>';
        else{b.disabled=false;b.textContent='💾 다시 시도 ('+failCnt+'게임 실패)';}
      }
      pickToast(failCnt===0?('✅ '+okCnt+'게임 모두 저장됐어요 — 결과는 내정보 탭에서 자동 확인'):('⚠ '+okCnt+'게임 저장, '+failCnt+'게임 실패 — 실패한 게임은 개별 저장으로 다시 시도해 주세요'));
      return;
    }
    if(b)b.textContent=(idx+1)+'/'+total+' 저장 중...';
    var gi=items[idx],csv=p.games[gi].join(','),btn=document.getElementById('qr-sv-'+gi);
    if(!btn||state.savedKeys[p.round+':'+csv]){step(idx+1);return;}
    savePick(btn,p.round,csv,'qr',function(ok){
      if(ok)okCnt++;else failCnt++;
      step(idx+1);
    });
  }
  step(0);
}
function stopQrStream(){
  qrActive=false;
  if(qrTimer){try{clearTimeout(qrTimer);}catch(e){}qrTimer=null;}
  if(qrStream){
    var ts=qrStream.getTracks();
    for(var i=0;i<ts.length;i++){try{ts[i].stop();}catch(e2){}}
    qrStream=null;
  }
  var v=document.getElementById('qr-video');
  if(v){try{v.srcObject=null;}catch(e3){}}
}
function closeQrScan(){
  stopQrStream();
  var md=document.getElementById('qr-modal');
  if(md)md.style.display='none';
}

function sdkToday(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
function sdkHash(s){var h=5381,i;for(i=0;i<s.length;i++){h=(h*33+s.charCodeAt(i))%1000000007;}return h;}
function sdkGroupList(which){
  var cfg=SDK_CFG[which],n=cfg.size,gs=[],r,c,br,bc,i,j,g;
  for(r=0;r<n;r++){g=[];for(c=0;c<n;c++)g.push(r*n+c);gs.push(g);}
  for(c=0;c<n;c++){g=[];for(r=0;r<n;r++)g.push(r*n+c);gs.push(g);}
  for(br=0;br<n;br+=cfg.bh)for(bc=0;bc<n;bc+=cfg.bw){
    g=[];for(i=0;i<cfg.bh;i++)for(j=0;j<cfg.bw;j++)g.push((br+i)*n+bc+j);gs.push(g);
  }
  return gs;
}
function sdkCheck(cells,which){
  var cfg=SDK_CFG[which],n=cfg.size,n2=n*n,i,j;
  if(!cells||cells.length!==n2)return false;
  for(i=0;i<n2;i++)if(!cells[i]||cells[i]<1||cells[i]>n)return false;
  var gs=sdkGroupList(which);
  for(i=0;i<gs.length;i++){
    var seen={},g=gs[i];
    for(j=0;j<g.length;j++){var v=cells[g[j]];if(seen[v])return false;seen[v]=1;}
  }
  return true;
}
function sdkBankOf(which){
  if(which==='m')return state.sdk.bank;
  if(which==='b')return state.sdk.bank6;
  return state.sdk.bank9;
}
function sdkPuzzleIdx(which){
  var bank=sdkBankOf(which);
  if(!bank||!bank.puzzles||!bank.puzzles.length)return -1;
  var n=bank.puzzles.length,d=sdkToday();
  var salt=which==='m'?'':(which==='b'?'B1':'B2');
  return sdkHash(d+salt)%n;
}
function sdkPuzzleStr(which){
  var bank=sdkBankOf(which),idx=sdkPuzzleIdx(which);
  return idx<0?null:bank.puzzles[idx];
}
// 뱅크의 인코딩 정답(sols) 복호화 — 생성기(gen-sudoku-bank*.mjs)와 동일 스킴:
//   enc[i]=((s[i]-1+ks(i))%n)+1, ks(i)=sdkHash(p+'K'+i)%n (p=클루 문자열이 곧 시드 — 별도 키 불필요)
// 역연산: s[i]=((e[i]-1-ks(i)+n)%n)+1. 실패(길이·범위 이상) 시 null.
function sdkDecodeSol(p,enc,n){
  if(!p||!enc||enc.length!==p.length)return null;
  var out=[],i,ks,v;
  for(i=0;i<p.length;i++){
    ks=sdkHash(p+'K'+i)%n;
    v=enc.charCodeAt(i)-48;
    if(v<1||v>n)return null;
    out.push(((v-1-ks+n)%n)+1);
  }
  return out;
}
function sdkDoneLocal(){var f='';try{f=localStorage.getItem('lotto-sdk-done-'+sdkToday())||'';}catch(e){}return f;}
function sdkMarkDoneLocal(which){try{var f=sdkDoneLocal();if(f.indexOf(which)<0)localStorage.setItem('lotto-sdk-done-'+sdkToday(),f+which);}catch(e){}}
function sdkSaveLocal(){try{localStorage.setItem('lotto-sdk-'+state.sdk.date,JSON.stringify({m:state.sdk.cells.m,b:state.sdk.cells.b,c:state.sdk.cells.c}));}catch(e){}}
// 날짜 바뀌면 전체 초기화, 같은 날엔 아직 뱅크가 안 온 티어만 증분 초기화
function sdkInit(){
  var d=sdkToday();
  if(state.sdk.date!==d||!state.sdk.cells){
    state.sdk.date=d;state.sdk.cells={};state.sdk.given={};state.sdk.solution={};state.sdk.done={m:false,b:false,c:false};state.sdk.sel=null;state.sdk.startMs={m:0,b:0,c:0};state.sdk.conf={};state.sdk.celeb={m:{},b:{},c:{}};
  }
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('lotto-sdk-'+d)||'null');}catch(e){saved=null;}
  var w,i;
  for(w=0;w<SDK_WHICHES.length;w++){
    var which=SDK_WHICHES[w];
    if(state.sdk.cells[which])continue;
    var pz=sdkPuzzleStr(which);
    if(!pz)continue;
    var n2=SDK_CFG[which].size*SDK_CFG[which].size,nmax=SDK_CFG[which].size,cells=[],given=[];
    if(pz.length!==n2)continue;
    for(i=0;i<n2;i++){var ch=pz.charAt(i),v=ch==='0'?0:parseInt(ch,10);cells.push(v);given.push(v>0);}
    if(saved&&saved[which]&&saved[which].length===n2){
      for(i=0;i<n2;i++){var sv=saved[which][i];if(!given[i]&&sv>=1&&sv<=nmax)cells[i]=sv;}
    }
    state.sdk.cells[which]=cells;state.sdk.given[which]=given;
    // 인코딩 정답 복호화해 보관 — 그룹 완성(축하) 판정은 이 배열과의 정확 일치로만 한다
    if(!state.sdk.solution)state.sdk.solution={};
    var bank=sdkBankOf(which),pidx=sdkPuzzleIdx(which);
    state.sdk.solution[which]=(bank&&bank.sols&&bank.sols[pidx])?sdkDecodeSol(pz,bank.sols[pidx],nmax):null;
  }
  var df=sdkDoneLocal();
  if(df.indexOf('m')>=0)state.sdk.done.m=true;
  if(df.indexOf('b')>=0)state.sdk.done.b=true;
  if(df.indexOf('c')>=0)state.sdk.done.c=true;
  if(state.sdk.st){
    if(state.sdk.st.todayMain)state.sdk.done.m=true;
    if(state.sdk.st.todayBonus1)state.sdk.done.b=true;
    if(state.sdk.st.todayBonus2)state.sdk.done.c=true;
  }
}

// 셀 i가 속한 행·열·블록의 그룹 인덱스 3개 (sdkGroupList 순서: 행들→열들→블록들)
function sdkGroupsOf(which,i){
  var cfg=SDK_CFG[which],n=cfg.size,r=Math.floor(i/n),c=i%n;
  var bi=Math.floor(r/cfg.bh)*Math.floor(n/cfg.bw)+Math.floor(c/cfg.bw);

function sdkConflictSet(which){

  for(gi=0;gi<gs.length;gi++){

    for(j=0;j<g.length;j++){v=cells[g[j]];if(v)cnt[v]=(cnt[v]||0)+1;}
    for(j=0;j<g.length;j++){v=cells[g[j]];if(v&&cnt[v]>1)set[g[j]]=1;}
  }
  return set;
}

  if(!state.sdk.cells||!state.sdk.cells.m)return '<div class="card" style="text-align:center;color:#F87171;padding:30px">퍼즐 데이터 오류</div>';
  if(state.session&&!state.sdk.st&&!state.sdk.stBusy)loadSdkStatus();
  sdkMaybeResubmit();
  return '<div class="card" id="sdk-streak-card" style="border-color:rgba(232,169,58,.2)">'+sdkStreakCardHTML()+'</div>'
    +sdkPuzzleCardHTML('m')
    +sdkPuzzleCardHTML('b')
    +sdkPuzzleCardHTML('c')
    +'<div class="card cd" style="font-size:11px;color:#8A8A93;line-height:1.8">모든 행·열·블록에 숫자가 한 번씩 들어가면 완성!<br>메인 4×4를 매일 완료하면 🧩 연속 기록이 쌓이고, 연속 14일·30일엔 프리미엄 체험권을 드려요.<br>보너스 6×6·9×9는 연속 기록과 무관 — 누적 완료 수에만 +1씩 쌓여요.</div>';
}
function sdkSel(which,i){
  if(!state.sdk.cells||state.sdk.done[which])return;
  if(state.sdk.given[which][i])return;
  var prev=state.sdk.sel;
  state.sdk.sel={w:which,i:i};
  if(prev)sdkPaintCell(prev.w,prev.i);
  sdkPaintCell(which,i);
}
function sdkPaintCell(which,i){
  var el=document.getElementById('sdk-c-'+which+'-'+i);
  if(!el)return;
  var v=state.sdk.cells[which][i];

}
function sdkMsg(which,t){var el=document.getElementById('sdk-msg-'+which);if(el)el.textContent=t||'';}
function sdkNum(which,n){

  var s=state.sdk.sel;
  if(!s||s.w!==which){sdkMsg(which,'숫자를 넣을 칸을 먼저 눌러주세요');return;}
  if(!state.sdk.startMs[which])state.sdk.startMs[which]=Date.now();

// 그룹 "진짜 완성" 판정: 그룹 자체가 유일성 만족(sdkGroupOk) + 그 그룹의 어떤 칸도
// 다른 그룹과의 전역 충돌셋(sdkIsConf)에 걸려있지 않아야 함 — 충돌 빨간 배경 위에 초록 펄스가 덮이는 것 방지
function sdkGroupClean(which,g){
  if(!sdkGroupOk(which,g))return false;
  var j;
  for(j=0;j<g.length;j++)if(sdkIsConf(which,g[j]))return false;
  return true;
}
// 그룹 완성(축하) 판정 v2: "중복 없음"이 아니라 "정답과 정확히 일치"여야 축하.
// 중복 없이 채워도 정답과 다른 배치면 나중에 모순이 드러나 되돌려야 함(오너 실제 재현) — 그 경우 축하 금지.
// 정답이 없을 때(구 뱅크 캐시 등)만 종전 sdkGroupClean으로 폴백.
function sdkGroupMatchesSolution(which,g){
  var sol=state.sdk.solution&&state.sdk.solution[which];
  if(!sol)return sdkGroupClean(which,g);
  var cells=state.sdk.cells[which],j;
  for(j=0;j<g.length;j++)if(cells[g[j]]!==sol[g[j]])return false;
  return true;
}
// 입력 셀이 속한 행·열·블록의 셀만 재페인트(4×4=8칸·6×6=13칸·9×9=21칸, 전체 재렌더 없음)
// + 충돌 펄스 + "방금 완성된" 그룹 축하 효과
function sdkPaintAround(which,i){
  var gs=sdkGroupList(which),gis=sdkGroupsOf(which,i),touch={},k,j,g,key;
  for(k=0;k<3;k++){g=gs[gis[k]];for(j=0;j<g.length;j++)touch[g[j]]=1;}
  for(key in touch)if(touch.hasOwnProperty(key))sdkPaintCell(which,parseInt(key,10));
  if(!state.sdk.celeb)state.sdk.celeb={m:{},b:{},c:{}};
  var celeb=state.sdk.celeb[which];
  // 완성 판정은 "편집한 칸이 속한 3개 그룹"만: 축하는 그 그룹을 직접 편집해 완성시켰을 때만.
  // 다른 곳 편집으로 간접적으로 깨끗해진 그룹이 뒤늦게 축하받으면 안 됨(오너 피드백).
  // 판정은 sdkGroupMatchesSolution — 복호화한 정답과 정확 일치해야 축하 (중복 없음만으론 오발동, 오너 재현).
  for(k=0;k<3;k++){
    var gi=gis[k];g=gs[gi];
    if(sdkGroupMatchesSolution(which,g)){
      if(!celeb[gi]){celeb[gi]=1;sdkFlash(which,g,'sdk-pop',750);}
    }else if(celeb[gi])delete celeb[gi];
  }
  if(sdkIsConf(which,i))sdkFlash(which,[i],'sdk-bad',480);
}
// cls를 잠깐 붙였다 떼는 원샷 애니메이션 (setTimeout 콜백은 iOS 지침대로 try-catch)
function sdkFlash(which,idxs,cls,ms){
  var els=[],j,el;
  for(j=0;j<idxs.length;j++){
    el=document.getElementById('sdk-c-'+which+'-'+idxs[j]);
    if(el){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);els.push(el);}
  }
  setTimeout(function(){try{var x;for(x=0;x<els.length;x++)els[x].classList.remove(cls);}catch(e){}},ms);
}
function sdkAfterInput(which){
  var cfg=SDK_CFG[which],n2=cfg.size*cfg.size,cells=state.sdk.cells[which],i,filled=true;
  for(i=0;i<n2;i++)if(!cells[i]){filled=false;break;}
  if(!filled){sdkMsg(which,'');return;}
  if(sdkCheck(cells,which))sdkComplete(which);
  else sdkMsg(which,'⚠ 겹치는 숫자가 있어요 — 행·열·'+cfg.blockTxt+'을 다시 확인!');
}
function sdkComplete(which){
  state.sdk.done[which]=true;state.sdk.sel=null;
  sdkMarkDoneLocal(which);
  var secs=null;
  if(state.sdk.startMs[which])secs=Math.round((Date.now()-state.sdk.startMs[which])/1000);
  var body=document.getElementById('sdk-body-'+which);
  if(body)body.innerHTML=sdkDoneBodyHTML(which);
  if(which==='m')gamesBannerRefresh();

}
function sdkSubmit(which,secs){
  if(!state.session||state.sdk.busy[which])return;

  if(secs!==null&&secs!==undefined)body.seconds=secs;
  fetch(SB_URL+'/functions/v1/sudoku',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){

        var sc=document.getElementById('sdk-streak-card');if(sc)sc.innerHTML=sdkStreakCardHTML();
        var mc=document.getElementById('game-me-sudoku');if(mc)mc.innerHTML=sdkMeCardHTML();
        lbLoad('sudoku',SDK_CFG[which].tier,true); // 방금 기록이 반영된 주간 리더보드 재조회 (박스만 국소 갱신)
        if(j.newRewards&&j.newRewards.length){
          var names=[],k,x;
          for(k=0;k<j.newRewards.length;k++){for(x=0;x<SDK_BADGES.length;x++){if(SDK_BADGES[x].kind===j.newRewards[k])names.push(SDK_BADGES[x].icon+' '+SDK_BADGES[x].label);}}
          if(names.length)pickToast('🎉 배지 획득: '+names.join(', '));
        }
      }else{
        if(el)el.textContent='⚠ 기록 저장 실패 — '+((j&&j.error)||'서버 오류');
      }
    })
    .catch(function(e){
      state.sdk.busy[which]=false;
      var el2=document.getElementById('sdk-sub-'+which);
      if(el2)el2.textContent='⚠ 서버 연결 실패 — 탭을 다시 열면 자동 재시도합니다';
    });
}
// 오늘 메인 퍼즐 완료 여부 (서버 현황 우선, 없으면 로컬 플래그)

// ── 🏆 주간 리더보드 (scores Edge Function) — 일요일 00시(KST) 리셋, 게임·티어별 최단 기록 ──
// week_start·마스킹은 전부 서버 계산 — 클라이언트는 표시와 제출만 담당 (원본 이메일 미수신)
// 캐시: state.lb[key]에 보관, LB_TTL 지나면 재조회. 갱신은 해당 박스만 국소 페인트(전체 재렌더 없음)
var LB_TTL=300000; // 5분
var MM_TIER={e:'easy',m:'normal',h:'hard'};
var LB_LABEL={'memory|easy':'쉬움 4×4','memory|normal':'보통 6×6','memory|hard':'어려움 9×9'};
function lbKey(g,t){return g+'|'+(t||'');}
function lbElId(g,t){return 'lb-'+g+(t?'-'+t:'');}
function lbInnerHTML(g,t){
  var e=state.lb[lbKey(g,t)];
  var lab=LB_LABEL[lbKey(g,t)];
  var head='🏆 이번 주 최단'+(lab?' · '+lab:'');
  if(e&&e.err)return '<span style="color:#8A8A93">'+head+' — 기록을 불러오지 못했어요</span>';
  if(!e||!e.loaded)return '<span style="color:#8A8A93">'+head+' — 불러오는 중...</span>';
  var mineLine=(typeof e.mine==='number')?'<br><span style="color:#E8A93A">내 최단: '+fmtNum(e.mine)+'초</span>':'';
  if(!e.top)return '<span style="color:#8A8A93">'+head+' — 아직 기록이 없어요, 첫 기록의 주인공이 되어보세요!</span>'+mineLine;
  return '<span style="color:#E8A93A">'+head+': <b>'+e.top.name+'</b> '+fmtNum(e.top.seconds)+'초</span>'+mineLine;
}
function lbPaint(g,t){var el=document.getElementById(lbElId(g,t));if(el)el.innerHTML=lbInnerHTML(g,t);}
function lbBoxHTML(g,t){
  var e=state.lb[lbKey(g,t)];
  if(!e||!e.loaded||(Date.now()-(e.ts||0)>LB_TTL))lbLoad(g,t,false);
  return '<div id="'+lbElId(g,t)+'" style="font-size:11px;text-align:center;margin-bottom:9px;padding:7px 8px;border-radius:12px;background:rgba(232,169,58,.05);border:1px solid rgba(232,169,58,.16)">'+lbInnerHTML(g,t)+'</div>';
}
function lbLoad(g,t,force){
  var k=lbKey(g,t),e=state.lb[k];
  if(e&&e.busy)return;
  if(e&&e.loaded&&!force&&Date.now()-(e.ts||0)<=LB_TTL)return;
  state.lb[k]={busy:true,loaded:e?e.loaded:false,top:e?e.top:null,mine:e?e.mine:null,ts:e?e.ts:0,err:false};
  var tok=state.session?state.session.access_token:SB_ANON;
  fetch(SB_URL+'/functions/v1/scores?game_id='+g+'&tier='+encodeURIComponent(t||''),{headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(j){
      var e2=state.lb[k];
      e2.busy=false;
      if(j&&j.ok){e2.loaded=true;e2.top=j.top||null;e2.mine=(typeof j.mine==='number')?j.mine:null;e2.ts=Date.now();e2.err=false;}
      else e2.err=true;
      lbPaint(g,t);
    })
    .catch(function(err){var e3=state.lb[k];e3.busy=false;e3.err=true;lbPaint(g,t);});
}
// 완료 시 기록 제출 — 로그인 유저만 (게스트는 스킵). 응답의 top으로 박스만 국소 갱신
function lbSubmit(g,t,secs){
  if(!state.session)return;
  var s=Math.round(secs||0);if(s<1)s=1;if(s>86400)s=86400;
  fetch(SB_URL+'/functions/v1/scores',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'submit',game_id:g,tier:t||'',seconds:s})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.ok)return;
      var k=lbKey(g,t);
      state.lb[k]={busy:false,loaded:true,top:j.top||null,mine:(typeof j.best==='number')?j.best:null,ts:Date.now(),err:false};
      lbPaint(g,t);
      if(j.improved)pickToast('🏆 이번 주 내 최고 기록 갱신! '+fmtNum(j.best)+'초');
    })
    .catch(function(e){});
}

// ── 🔍 틀린 번호 찾기 (Phase 3) — 순수 클라이언트 게임 ──
// 1~45 랜덤 5×5 그리드 2개(원본/비교) — 비교판의 3~5칸만 다른 숫자. 퍼즐뱅크·서버 저장 없음, 매 판 즉석 생성.
var FW_N=5,FW_MAX=45;
function fwNew(){
  var n2=FW_N*FW_N,left=[],i,r,t;
  for(i=0;i<n2;i++)left.push(1+Math.floor(Math.random()*FW_MAX));
  var total=3+Math.floor(Math.random()*3); // 다른 칸 3~5개
  var pool=[];
  for(i=0;i<n2;i++)pool.push(i);
  for(i=0;i<total;i++){r=i+Math.floor(Math.random()*(n2-i));t=pool[i];pool[i]=pool[r];pool[r]=t;}
  var right=left.slice(),diff={};
  for(i=0;i<total;i++){
    var idx=pool[i],nv=left[idx];
    while(nv===left[idx])nv=1+Math.floor(Math.random()*FW_MAX);
    right[idx]=nv;diff[idx]=1;
  }
  state.fw={left:left,right:right,diff:diff,found:{},foundCnt:0,total:total,startMs:Date.now(),done:false,doneSecs:0};
}
function fwCellStyle(side,i){
  var fw=state.fw,s='width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;padding:0;border:none;';

    if(side==='r')s+='background:rgba(74,222,128,.2);color:#4ADE80;box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.7);';
    else s+='background:rgba(74,222,128,.08);color:#86EFAC;';
  }
  else if(side==='l')s+='background:rgba(255,255,255,.07);color:#8A8A93;';
  else s+='background:rgba(232,169,58,.07);color:#E8A93A;';
  return s;
}
function fwGridHTML(side){
  var fw=state.fw,html='',r,c,i;
  for(r=0;r<FW_N;r++){
    html+='<div style="display:flex;gap:4px;justify-content:center;margin-top:'+(r?4:0)+'px">';
    for(c=0;c<FW_N;c++){
      i=r*FW_N+c;
      if(side==='l')html+='<div id="fw-l-'+i+'" style="'+fwCellStyle('l',i)+'">'+fw.left[i]+'</div>';

    +'<div id="fw-msg" style="font-size:11px;color:#F87171;text-align:center;min-height:15px;margin-top:6px"></div>';

function fwDoneHTML(){

// 클릭한 셀만 국소 갱신 (전체 재렌더 없음) — 정답=초록 고정, 오답=빨간 펄스 후 원복
function fwClick(i){
  var fw=state.fw;
  if(!fw||fw.done||fw.found[i])return;
  var el=document.getElementById('fw-r-'+i);
  if(fw.diff[i]){
    fw.found[i]=1;fw.foundCnt++;
    if(el){el.setAttribute('style',fwCellStyle('r',i));el.classList.remove('sdk-pop');void el.offsetWidth;el.classList.add('sdk-pop');}
    var lel=document.getElementById('fw-l-'+i);
    if(lel)lel.setAttribute('style',fwCellStyle('l',i));
    var cnt=document.getElementById('fw-cnt');
    if(cnt)cnt.textContent=String(fw.foundCnt);
    fwMsg('');
    if(fw.foundCnt>=fw.total){
      fw.done=true;fw.doneSecs=Math.round((Date.now()-fw.startMs)/1000);
      var body=document.getElementById('fw-body');
      if(body)body.innerHTML=fwDoneHTML();
      if(state.session)lbSubmit('findwrong','',fw.doneSecs); // 게스트는 리더보드 제출 스킵
    }
  }else{
    if(el){el.classList.remove('sdk-bad');void el.offsetWidth;el.style.background='rgba(248,113,113,.22)';el.style.color='#F87171';el.classList.add('sdk-bad');}
    fwMsg('⚠ 그 칸은 양쪽이 같아요');
    setTimeout(function(){try{if(el){el.classList.remove('sdk-bad');el.setAttribute('style',fwCellStyle('r',i));}fwMsg('');}catch(e){}},480);
  }
}
function renderFindWrong(){
  if(!state.fw||!state.fw.left||state.fw.done)fwNew(); // 완료했거나 처음이면 새 판 (진행 중이면 유지)
  return '<div class="card"><div class="ttl" style="margin-bottom:3px">🔍 틀린 번호 찾기</div><div id="fw-sub" style="font-size:11px;color:#8A8A93;margin-bottom:9px">위 원본과 다른 칸이 아래 비교판에 '+state.fw.total+'개 숨어 있어요 — 아래에서 찾아 누르세요!</div>'+lbBoxHTML('findwrong','')+'<div id="fw-body">'+fwBoardHTML()+'</div></div>'
    +'<div class="card cd" style="font-size:11px;color:#8A8A93;line-height:1.8">1~45 로또 번호로 만든 5×5 그리드 두 개를 비교하는 순발력 게임이에요.<br>정답이면 초록, 아니면 빨강 — 전부 찾으면 걸린 시간이 표시됩니다. 매 판 새로 생성!</div>';
}

// ── 🃏 기억력 짝맞추기 (Phase 4) — 순수 클라이언트 게임 (findwrong과 동일 패턴, 서버 저장 없음) ──
// 1~45 로또 번호에서 난이도별 쌍 수만큼 뽑아 2장씩 섞어 배치 → 미리보기 후 전부 가리고 짝 찾기.
// 9×9는 81칸이 홀수라 40쌍(80칸)+⭐ 장식 1칸(이미 완성 취급, 클릭 불가)으로 구성.
var MM_CFG={
  e:{n:4,pairs:8,prev:4,cell:56,gap:6,fs:20,label:'4×4',sub:'8쌍 · 미리보기 4초'},
  m:{n:6,pairs:18,prev:6,cell:40,gap:4,fs:16,label:'6×6',sub:'18쌍 · 미리보기 6초'},
  h:{n:9,pairs:40,prev:9,cell:28,gap:2,fs:12,label:'9×9',sub:'40쌍+⭐ · 미리보기 9초'}
};
var MM_GEN=0; // 판 세대 — 이전 판의 setTimeout이 새 판을 건드리지 못하게 하는 무효화 토큰
function mmNew(lvl){
  var cfg=MM_CFG[lvl],pool=[],vals=[],i,r,t;
  for(i=1;i<=45;i++)pool.push(i);
  for(i=0;i<cfg.pairs;i++){r=i+Math.floor(Math.random()*(45-i));t=pool[i];pool[i]=pool[r];pool[r]=t;}
  for(i=0;i<cfg.pairs;i++){vals.push(pool[i]);vals.push(pool[i]);}
  if(cfg.n*cfg.n>cfg.pairs*2)vals.push(0); // 홀수 보드 보정 — 0=⭐ 장식 칸
  for(i=vals.length-1;i>0;i--){r=Math.floor(Math.random()*(i+1));t=vals[i];vals[i]=vals[r];vals[r]=t;}
  MM_GEN++;
  state.mm={lvl:lvl,cells:vals,matched:{},open:[],busy:false,preview:true,prevLeft:cfg.prev,matchedCnt:0,tries:0,startMs:0,done:false,doneSecs:0,gen:MM_GEN};
  mmTick(MM_GEN);
}
// 미리보기 카운트다운 — 1초 체인. 세대가 바뀌면(새 판/메뉴 복귀) 조용히 소멸
function mmTick(gen){
  setTimeout(function(){try{
    var mm=state.mm;
    if(!mm||mm.gen!==gen||!mm.preview||mm.done)return;
    mm.prevLeft--;
    if(mm.prevLeft<=0){mmHideAll();return;}
    var el=document.getElementById('mm-cd');
    if(el)el.textContent=mm.prevLeft+'초';
    mmTick(gen);
  }catch(e){}},1000);
}
function mmHideAll(){
  var mm=state.mm;
  if(!mm)return;
  mm.preview=false;mm.startMs=Date.now();
  var i;
  for(i=0;i<mm.cells.length;i++)mmPaint(i);
  var st=document.getElementById('mm-status');
  if(st)st.innerHTML=mmStatusHTML();
}
function mmOpenHas(i){var o=state.mm.open,j;for(j=0;j<o.length;j++)if(o[j]===i)return true;return false;}
function mmCellTxt(i){
  var mm=state.mm;
  if(mm.cells[i]===0)return '⭐';
  if(mm.preview||mm.matched[i]||mmOpenHas(i))return String(mm.cells[i]);
  return '';
}
// 공개 상태는 ZONES 구간색으로 로또 느낌 — 맞춘 쌍=초록 고정, 가림=무지 회색
function mmCellStyle(i){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  var s='width:'+cfg.cell+'px;height:'+cfg.cell+'px;border-radius:'+(cfg.n===9?6:9)+'px;display:flex;align-items:center;justify-content:center;font-size:'+cfg.fs+'px;font-weight:800;padding:0;border:none;';
  if(mm.cells[i]===0)return s+'background:rgba(232,169,58,.08);color:#E8A93A;box-shadow:inset 0 0 0 1px rgba(232,169,58,.3);';
  if(mm.matched[i])return s+'background:rgba(74,222,128,.18);color:#4ADE80;box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.6);';
  if(mm.preview||mmOpenHas(i)){var z=gz(mm.cells[i]);return s+'background:'+z.c+'26;color:'+z.c+';box-shadow:inset 0 0 0 1.5px '+z.c+'66;';}
  return s+'background:rgba(255,255,255,.07);color:rgba(255,255,255,0);';
}
function mmPaint(i){
  var el=document.getElementById('mm-c-'+i);
  if(!el)return;
  el.textContent=mmCellTxt(i);
  el.setAttribute('style',mmCellStyle(i));
}
function mmFlash(i,cls){var el=document.getElementById('mm-c-'+i);if(el){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}}
function mmStatusHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  if(mm.preview)return '<span style="color:#E8A93A">👀 숫자 위치를 기억하세요! <span id="mm-cd">'+mm.prevLeft+'초</span> 후 가려집니다</span>';
  return '<span style="color:#4ADE80">맞춘 쌍 <span id="mm-cnt">'+mm.matchedCnt+'</span> / '+cfg.pairs+'</span> <span style="color:#8A8A93;font-weight:400">· 시도 <span id="mm-try">'+mm.tries+'</span>회</span>';
}
function mmBoardHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl],html='',r,c,i;
  for(r=0;r<cfg.n;r++){
    html+='<div style="display:flex;gap:'+cfg.gap+'px;justify-content:center;margin-top:'+(r?cfg.gap:0)+'px">';
    for(c=0;c<cfg.n;c++){
      i=r*cfg.n+c;
      html+='<button id="mm-c-'+i+'" onclick="mmClick('+i+')" style="'+mmCellStyle(i)+'">'+mmCellTxt(i)+'</button>';
    }
    html+='</div>';
  }
  return html+'<div id="mm-status" style="text-align:center;margin-top:11px;font-size:11px;font-weight:800">'+mmStatusHTML()+'</div>';
}
// 클릭한 셀만 국소 갱신 — 두 장 공개 후 판정 중(busy)엔 세 번째 클릭 무시
function mmClick(i){
  var mm=state.mm;
  if(!mm||mm.done||mm.busy||mm.preview)return;
  if(mm.cells[i]===0||mm.matched[i]||mmOpenHas(i))return;
  mm.open.push(i);
  mmPaint(i);
  if(mm.open.length<2)return;
  mm.tries++;
  var te=document.getElementById('mm-try');
  if(te)te.textContent=String(mm.tries);
  var a=mm.open[0],b=mm.open[1];
  if(mm.cells[a]===mm.cells[b]){
    mm.matched[a]=1;mm.matched[b]=1;mm.matchedCnt++;mm.open=[];
    mmPaint(a);mmPaint(b);mmFlash(a,'sdk-pop');mmFlash(b,'sdk-pop');
    var ce=document.getElementById('mm-cnt');
    if(ce)ce.textContent=String(mm.matchedCnt);
    if(mm.matchedCnt>=MM_CFG[mm.lvl].pairs){
      mm.done=true;mm.doneSecs=Math.round((Date.now()-mm.startMs)/1000);
      var body=document.getElementById('mm-body');
      if(body)body.innerHTML=mmDoneHTML();
      if(state.session)lbSubmit('memory',MM_TIER[mm.lvl],mm.doneSecs); // 게스트는 리더보드 제출 스킵
    }
  }else{
    mm.busy=true;
    mmFlash(a,'sdk-bad');mmFlash(b,'sdk-bad');
    setTimeout(function(){try{
      var m2=state.mm;
      if(!m2||m2.gen!==mm.gen)return;
      m2.busy=false;m2.open=[];
      mmPaint(a);mmPaint(b);
    }catch(e){}},800);
  }
}
function mmDoneHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  return '<div class="ap" style="text-align:center;padding:16px 0"><div style="font-size:34px;margin-bottom:6px">🎉</div><div style="font-size:13px;font-weight:800;color:#4ADE80">'+cfg.label+' '+cfg.pairs+'쌍 전부 맞췄어요!</div><div style="font-size:11px;color:#8A8A93;margin-top:6px">소요 시간 <b style="color:#E8A93A">'+mm.doneSecs+'초</b> · 시도 <b style="color:#E8A93A">'+mm.tries+'회</b></div><div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button onclick="mmStart(\''+mm.lvl+'\')" style="padding:11px 20px;border-radius:999px;background:#E8A93A;color:#171207;box-shadow:0 10px 24px -8px rgba(232,169,58,.5);font-weight:700;font-size:13px;border:none">🔄 같은 난이도</button><button onclick="mmMenu()" style="padding:11px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#C7C7CC;font-weight:700;font-size:13px">난이도 선택</button></div></div>';
}
function mmMenuHTML(){
  var keys=['e','m','h'],names={e:'🌱 쉬움',m:'🌿 보통',h:'🌳 어려움'},html='',k,cfg;
  // 난이도 선택 위 — 티어별 이번 주 최단 기록
  for(k=0;k<3;k++)html+=lbBoxHTML('memory',MM_TIER[keys[k]]);
  html+='<div style="display:flex;flex-direction:column;gap:8px">';
  for(k=0;k<3;k++){
    cfg=MM_CFG[keys[k]];
    html+='<button onclick="mmStart(\''+keys[k]+'\')" style="display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:12px;border:1px solid rgba(232,169,58,.25);background:rgba(232,169,58,.06);color:#F2F2F0"><span style="font-size:13px;font-weight:800">'+names[keys[k]]+' <span style="color:#E8A93A">'+cfg.label+'</span></span><span style="font-size:11px;color:#8A8A93">'+cfg.sub+'</span></button>';
  }
  return html+'</div>';
}
function mmGameHTML(){
  var mm=state.mm,cfg=MM_CFG[mm.lvl];
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px"><span style="font-size:11px;font-weight:800;color:#E8A93A">'+cfg.label+' · '+cfg.pairs+'쌍</span><button onclick="mmMenu()" style="padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8A8A93;font-size:11px;font-weight:700">난이도 변경</button></div>'+lbBoxHTML('memory',MM_TIER[mm.lvl])+'<div id="mm-body">'+(mm.done?mmDoneHTML():mmBoardHTML())+'</div>';
}
function mmStart(lvl){
  mmNew(lvl);
  var w=document.getElementById('mm-wrap');
  if(w)w.innerHTML=mmGameHTML();
}
function mmMenu(){
  MM_GEN++; // 진행 중 타이머·판정 콜백 무효화
  state.mm=null;
  var w=document.getElementById('mm-wrap');
  if(w)w.innerHTML=mmMenuHTML();
}
function renderMemory(){
  if(state.mm&&state.mm.done){MM_GEN++;state.mm=null;} // 완료판은 재진입 시 난이도 선택부터 (진행 중이면 유지)
  return '<div class="card"><div class="ttl" style="margin-bottom:3px">🃏 기억력 짝맞추기</div><div style="font-size:11px;color:#8A8A93;margin-bottom:11px">같은 번호 두 장을 찾아 뒤집으세요 — 시작하면 잠깐 전체 공개!</div><div id="mm-wrap">'+(state.mm?mmGameHTML():mmMenuHTML())+'</div></div>'
    +'<div class="card cd" style="font-size:11px;color:#8A8A93;line-height:1.8">1~45 로또 번호가 두 장씩 숨어 있어요. 미리보기가 끝나면 전부 가려지고, 같은 번호 짝을 기억해서 찾는 게임!<br>서버 저장 없음 · 매 판 새로 섞임 · 9×9의 남는 한 칸은 ⭐ 보너스 칸(이미 완성 취급)이에요.</div>';
}

// ── 🎮 미니게임 허브 — 게임 추가는 GAMES 배열 등록 한 번이면 끝 (허브·추천배너·내정보 자동 반영) ──
// 필드: id/icon/name/desc · min(레벨 게이팅, 생략=0 공개) · daily(매일형 — todayDone과 함께 배너·미완료 배지 대상)
//       render(게임 화면 HTML) · todayDone(오늘 완료 여부, daily만) · meCard(내정보 기록 카드, 있는 게임만 나열)
var GAMES=[
  {id:'sudoku',icon:'🧩',name:'수도쿠',desc:'매일 새 퍼즐 · 연속 기록',min:0,daily:true,
   render:renderSudoku,todayDone:sdkTodayDone,meCard:sdkMeCardHTML},
  {id:'findwrong',icon:'🔍',name:'틀린 번호 찾기',desc:'5×5 위아래 비교 · 몇 초에 찾을까?',min:0,daily:false,
   render:renderFindWrong},
  {id:'memory',icon:'🃏',name:'기억력 짝맞추기',desc:'같은 번호 짝 찾기 · 3단계 난이도',min:0,daily:false,
   render:renderMemory}
];
function gameById(id){for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===id)return GAMES[i];return null;}
function gameLocked(g){return state.level===100?false:(effLv()<(g.min||0));}
function openGame(id){
  var g=gameById(id);
  if(!g)return;
  if(gameLocked(g)){pickToast('🔒 '+g.name+' — Lv.'+g.min+' '+lvInfo(g.min).name+'부터 이용할 수 있어요');return;}
  state.game=id;
  doTab('games');
}
function gamesHub(){state.game=null;doTab('games');}
function renderGames(){
  var g=state.game?gameById(state.game):null;
  if(g&&gameLocked(g)){state.game=null;g=null;} // 레벨 강등 등으로 잠기면 허브로 복귀
  if(g)return '<div style="margin-bottom:8px"><button onclick="gamesHub()" style="padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8A8A93;font-size:11px;font-weight:700">← 미니게임</button></div>'+g.render();
  var cards='',i;
  for(i=0;i<GAMES.length;i++){
    var gm=GAMES[i],locked=gameLocked(gm),badge='';
    if(!locked&&gm.daily&&gm.todayDone){
      if(gm.todayDone())badge='<span style="position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;color:#4ADE80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);padding:2px 7px;border-radius:8px">오늘 완료 ✓</span>';
      else badge='<span style="position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;color:#FB923C;background:rgba(251,146,60,.14);border:1px solid rgba(251,146,60,.4);padding:2px 7px;border-radius:8px">오늘 미완료</span>';
    }
    cards+='<div onclick="openGame(\''+gm.id+'\')" style="position:relative;background:rgba(255,255,255,.035);border:1px solid '+(locked?'rgba(255,255,255,.06)':'rgba(232,169,58,.22)')+';border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer'+(locked?';opacity:.5':'')+'">'+badge
      +'<div style="font-size:30px;margin-bottom:7px">'+(locked?'🔒':gm.icon)+'</div>'
      +'<div style="font-size:13px;font-weight:800;color:#F2F2F0">'+gm.name+'</div>'
      +'<div style="font-size:11px;color:#8A8A93;margin-top:4px;line-height:1.5">'+(locked?('Lv.'+gm.min+' '+lvInfo(gm.min).name+'부터'):gm.desc)+'</div></div>';
  }
  return '<div class="card"><div class="ttl" style="color:#E8A93A">🎮 미니게임 <span style="font-size:11px;color:#8A8A93;font-weight:400">잠깐 쉬어가는 두뇌 게임</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+cards+'</div></div>';
}
// 추천 탭 하단 배너 — daily 게임 중 오늘 미완료만 스캔 (1개=단일 배너, 2개+=칩 나열, 3개+는 "+N 더")
function gamesBannerHTML(){
  var pend=[],i,g;
  for(i=0;i<GAMES.length;i++){
    g=GAMES[i];
    if(!g.daily||!g.todayDone||gameLocked(g))continue;
    if(!g.todayDone())pend.push(g);
  }
  if(!pend.length)return '';
  if(pend.length===1){
    g=pend[0];
    return '<div class="card" id="game-rec-banner" onclick="openGame(\''+g.id+'\')" style="cursor:pointer;border-color:rgba(232,169,58,.3);background:rgba(232,169,58,.05);padding:11px 12px"><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;font-weight:700;color:#E8A93A">'+g.icon+' 오늘의 '+g.name+' 아직 안 했어요</span><span style="font-size:11px;color:#8A8A93">하러 가기 →</span></div></div>';
  }
  var chips='',shown=pend.length>2?2:pend.length;
  for(i=0;i<shown;i++){
    g=pend[i];
    chips+='<button onclick="openGame(\''+g.id+'\')" style="padding:7px 12px;border-radius:999px;border:1px solid rgba(232,169,58,.35);background:rgba(232,169,58,.1);color:#E8A93A;font-size:11px;font-weight:700">'+g.icon+' '+g.name+'</button>';
  }
  if(pend.length>2)chips+='<button onclick="gamesHub()" style="padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#8A8A93;font-size:11px;font-weight:700">+'+(pend.length-2)+' 더</button>';
  return '<div class="card" id="game-rec-banner" style="border-color:rgba(232,169,58,.3);background:rgba(232,169,58,.05);padding:11px 12px"><div style="font-size:11px;font-weight:700;color:#E8A93A;margin-bottom:8px">🎮 오늘의 게임 '+pend.length+'개 미완료</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+chips+'</div></div>';
}
// 게임 완료·서버 현황 도착 시 배너만 국소 갱신 (추천 탭에 떠 있을 때만 동작)
function gamesBannerRefresh(){
  var bn=document.getElementById('game-rec-banner');
  if(!bn)return;
  var h=gamesBannerHTML();
  if(h)bn.outerHTML=h;
  else bn.style.display='none';
}
// 내정보 "게임 기록" — meCard 가진 게임만 나열 (게임이 4개+ 되면 아코디언으로 확장 예정)
function gamesMeCardsHTML(){
  var html='',i,g;
  for(i=0;i<GAMES.length;i++){
    g=GAMES[i];
    if(!g.meCard)continue;
    html+='<div class="card" id="game-me-'+g.id+'" style="border-color:rgba(232,169,58,.2)">'+g.meCard()+'</div>';
  }
  return html;
}

// ── 데이터 (공개 통계) ──
function loadLatestWin(cb){
  if(state.latestWin!==null){if(cb)cb();return;}
  if(state.latestWinBusy)return;
  state.latestWinBusy=true;

function authErrKo(m){
  if(!m)return '오류가 발생했습니다.';
  if(m.indexOf('Invalid login credentials')>=0)return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if(m.indexOf('already registered')>=0)return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if(m.indexOf('at least 6')>=0)return '비밀번호는 6자 이상이어야 합니다.';
  if(m.indexOf('valid email')>=0||m.indexOf('invalid format')>=0)return '올바른 이메일 주소를 입력해 주세요.';
  if(m.indexOf('rate limit')>=0||m.indexOf('Too many')>=0)return '시도가 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
  return m;
}
function doAuth(){
  var email=document.getElementById('auth-email').value.trim();
  var pw=document.getElementById('auth-pw').value;
  var msg=document.getElementById('auth-msg');
  if(!email||pw.length<6){msg.textContent='이메일과 6자 이상 비밀번호를 입력하세요.';return;}
  msg.style.color='#8A8A93';msg.textContent='처리 중...';
  var p=state.authMode==='login'?sb.auth.signInWithPassword({email:email,password:pw}):sb.auth.signUp({email:email,password:pw});
  p.then(function(res){
    if(res.error){msg.style.color='#F87171';msg.textContent=authErrKo(res.error.message);return;}
    try{
      var rm=document.getElementById('auth-remember');
      if(rm&&rm.checked)localStorage.setItem('lotto-last-email',email);
      else localStorage.removeItem('lotto-last-email');
    }catch(e){}
    closeAuth();

// ── 2단계 인증(MFA) ──
// AAL(인증 보증 수준) 확인: MFA를 등록한 계정만 currentLevel(aal1)!==nextLevel(aal2)이 되어 챌린지가 뜬다.
// 미등록 계정은 currentLevel===nextLevel(aal1)이라 그대로 통과 → 등록 전 잠금(락아웃) 위험 없음.
function ensureAal(cb){
  if(!state.session){state.mfaOk=false;cb(true);return;}
  if(state.mfaOk){cb(true);return;}
  sb.auth.mfa.getAuthenticatorAssuranceLevel().then(function(res){
    var d=res&&res.data?res.data:null;
    if(d&&d.nextLevel==='aal2'&&d.currentLevel!==d.nextLevel){openMfaGate();cb(false);}
    else{state.mfaOk=true;cb(true);}
  }).catch(function(e){
    // AAL 조회 실패 시 UI는 통과(락아웃 방지) — 관리 API는 서버가 aal2를 강제하므로 보안 경계는 유지됨
    state.mfaOk=true;cb(true);
  });
}
function openMfaGate(){
  var g=document.getElementById('mfa-gate');if(!g)return;
  var i=document.getElementById('mfa-gate-code');if(i)i.value='';
  var m=document.getElementById('mfa-gate-msg');if(m)m.textContent='';
  g.style.display='block';
  setTimeout(function(){try{var i2=document.getElementById('mfa-gate-code');if(i2)i2.focus();}catch(e){}},80);
}
function closeMfaGate(){var g=document.getElementById('mfa-gate');if(g)g.style.display='none';}
function mfaGateCancel(){state.mfaResume=[];closeMfaGate();doLogout();}
function mfaResumeAll(){
  var rs=state.mfaResume;state.mfaResume=[];
  for(var i=0;i<rs.length;i++){try{rs[i]();}catch(e){}}
}
function mfaErrKo(msg){
  var m=String(msg||'');
  if(!m)return '오류가 발생했습니다.';
  if(m.toLowerCase().indexOf('invalid totp')>=0||(m.toLowerCase().indexOf('code')>=0&&m.toLowerCase().indexOf('invalid')>=0))return '코드가 올바르지 않습니다. 인증 앱의 최신 코드를 다시 입력하세요.';
  if(m.toLowerCase().indexOf('expired')>=0)return '코드가 만료됐습니다. 새 코드로 다시 시도하세요.';
  if(m.indexOf('rate limit')>=0||m.indexOf('Too many')>=0)return '시도가 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
  return m;
}
// 로그인 게이트: 등록된 TOTP 팩터로 challenge→verify. 성공 시 세션이 aal2 토큰으로 교체·저장됨(supabase-js가 처리)
function mfaGateVerify(){
  var i=document.getElementById('mfa-gate-code'),m=document.getElementById('mfa-gate-msg'),b=document.getElementById('mfa-gate-btn');
  var code=i?String(i.value).replace(/\D/g,''):'';
  if(code.length!==6){if(m){m.style.color='#E8A93A';m.textContent='6자리 숫자 코드를 입력하세요.';}return;}
  if(state.mfaBusy)return;
  state.mfaBusy=true;
  if(m){m.style.color='#8A8A93';m.textContent='확인 중...';}
  if(b)b.disabled=true;
  sb.auth.mfa.listFactors().then(function(res){
    var f=(res&&res.data&&res.data.totp&&res.data.totp.length)?res.data.totp[0]:null;
    if(!f)throw new Error('등록된 인증 수단을 찾지 못했습니다. 다시 로그인해 주세요.');
    return sb.auth.mfa.challenge({factorId:f.id}).then(function(ch){
      if(ch.error)throw ch.error;
      return sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code:code});
    });
  }).then(function(vr){
    state.mfaBusy=false;if(b)b.disabled=false;
    if(vr.error){if(m){m.style.color='#F87171';m.textContent=mfaErrKo(vr.error.message);}return;}
    state.mfaOk=true;
    closeMfaGate();
    mfaResumeAll();
  }).catch(function(e){
    state.mfaBusy=false;if(b)b.disabled=false;
    if(m){m.style.color='#F87171';m.textContent=mfaErrKo(e&&e.message?e.message:e);}
  });
}

function mfaStartEnroll(){
  if(state.mfaSet.vbusy)return;
  state.mfaSet.vbusy=true;state.mfaSet.msg='';
  if(state.tab==='adm')doTab('adm');
  // 만들다 만(미검증) TOTP 팩터가 남아 있으면 정리 후 새로 발급 — 재시도 시 enroll 충돌 방지
  sb.auth.mfa.listFactors().then(function(res){
    var all=(res&&res.data&&res.data.all)?res.data.all:[];
    var chain=Promise.resolve(),i;
    for(i=0;i<all.length;i++){
      if(all[i].factor_type==='totp'&&all[i].status!=='verified'){
        (function(fid){chain=chain.then(function(){return sb.auth.mfa.unenroll({factorId:fid});});})(all[i].id);
      }
    }
    return chain;
  }).then(function(){
    return sb.auth.mfa.enroll({factorType:'totp',friendlyName:'LuckyDaily'});
  }).then(function(res){
    state.mfaSet.vbusy=false;
    if(res.error){state.mfaSet.msg=mfaErrKo(res.error.message);if(state.tab==='adm')doTab('adm');return;}
    var d=res.data;
    state.mfaSet.enroll={
      id:d.id,
      qr:(d.totp&&d.totp.qr_code)?d.totp.qr_code:'',
      secret:(d.totp&&d.totp.secret)?d.totp.secret:''
    };
    state.mfaSet.msg='';
    if(state.tab==='adm')doTab('adm');
  }).catch(function(e){
    state.mfaSet.vbusy=false;
    state.mfaSet.msg=mfaErrKo(e&&e.message?e.message:e);
    if(state.tab==='adm')doTab('adm');
  });
}

    openAuth();

    if(_am){_am.style.color='#F87171';_am.textContent='소셜 로그인 실패: '+(_hm?decodeURIComponent(_hm[1].replace(/\+/g,' ')):'설정을 확인해 주세요');}
    history.replaceState(null,'',window.location.pathname);
  }
}catch(e){}
sb.auth.getSession().then(function(res){
  state.session=res.data?res.data.session:null;
  // 세션 복원 시에도 AAL 확인 — 이미 aal2로 통과한 세션은 저장돼 있어 재차 코드를 묻지 않음
  var bootMain=function(){
  loadProfile(function(){
    refresh();
    trackVisit();
    if(state.session){doCheckin();loadSdkStatus();}
    var exp=Math.floor((Date.now()-1039264200000)/604800000)+1;
    var eN=document.getElementById('h-next');if(eN)eN.textContent=exp+1;
    loadDraws(function(){
      var eN2=document.getElementById('h-next');
      if(eN2&&state.draws&&state.draws.length){
        var latest=state.draws[0].round;
        eN2.textContent=(exp>latest?exp:latest)+1;
      }
      if(state.tab==='freq'||state.tab==='hist'||state.tab==='hot')doTab(state.tab);
    });
  });
  };
  ensureAal(function(ok){if(ok)bootMain();else state.mfaResume.push(bootMain);});
});
</script>

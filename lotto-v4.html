<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로또 분석기">
<title>🎱 로또 분석기 v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;background:#07071a;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#07071a 0%,#0d0d25 50%,#100820 100%);color:#DDE3F5;min-height:100svh;padding-bottom:env(safe-area-inset-bottom,20px);}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;border:none;}
.rj{font-weight:800;letter-spacing:-.03em;}
@keyframes popIn{0%{transform:scale(0);opacity:0}65%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
@keyframes spin2{0%,100%{opacity:1}50%{opacity:.3}}
.ap{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;}
.as{animation:spin2 1.4s ease-in-out infinite;}
#hdr{padding:max(env(safe-area-inset-top,14px),14px) 14px 12px;text-align:center;border-bottom:1px solid rgba(251,191,36,.12);background:linear-gradient(180deg,rgba(251,191,36,.06) 0%,transparent 100%);}
#hdr h1{font-size:22px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#FBBF24,#FB923C,#FBBF24);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite;}
#hdr p{font-size:10px;color:#5A6A8E;margin-top:4px;}
.zdots{display:flex;gap:8px;justify-content:center;margin-top:7px;flex-wrap:wrap;}
.zdot{display:flex;align-items:center;gap:3px;font-size:9px;}
.zd{width:7px;height:7px;border-radius:50%;}
#stats{display:flex;gap:7px;padding:10px 9px 0;}
.stat{flex:1;background:rgba(255,255,255,.04);border-radius:13px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06);}
.sv{font-size:16px;font-weight:800;letter-spacing:-.03em;}
.sl{font-size:9px;color:#6B7A9E;margin-top:2px;}
#tab-nav{display:flex;gap:5px;overflow-x:auto;padding:10px 9px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#tab-nav::-webkit-scrollbar{display:none;}
.tb{padding:8px 11px;border-radius:18px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:#7080A0;font-size:11px;white-space:nowrap;flex-shrink:0;min-height:36px;transition:all .15s;}
.tb.on{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.11);color:#FBBF24;font-weight:700;}
#content{padding:0 9px;}
.card{background:rgba(255,255,255,.035);border-radius:18px;border:1px solid rgba(255,255,255,.07);padding:14px 12px;margin-bottom:10px;}
.cg{background:rgba(74,222,128,.04);border-color:rgba(74,222,128,.18);}
.cd{background:rgba(255,255,255,.02);}
.ttl{font-size:12px;font-weight:700;margin-bottom:11px;}
.ball{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;user-select:none;flex-shrink:0;}
.sb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:9px;font-weight:800;}
.freq-bars{display:flex;gap:1px;align-items:flex-end;height:120px;overflow-x:auto;padding:0 0 4px;}
.fb{width:7px;min-width:7px;border-radius:2px 2px 0 0;}
.tag{font-size:9px;padding:2px 6px;border-radius:5px;}
.set-tags{display:flex;gap:5px;margin-top:7px;margin-left:29px;}
.bt-table{width:100%;font-size:10px;border-collapse:collapse;}
.bt-table th{padding:6px 5px 8px;color:#5A6A8E;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);}
.bt-table td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.05);}
.duo-row{background:rgba(255,255,255,.025);border-radius:14px;padding:11px 10px;margin-bottom:8px;border:1px solid rgba(251,191,36,.12);}
.footer{text-align:center;font-size:9px;color:#3A4460;line-height:1.9;padding:4px 8px 20px;}
#err-banner{display:none;position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:12px 14px;z-index:9999;font-size:11px;line-height:1.7;word-break:break-all;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="err-banner"></div>
<div id="hdr">
  <h1>🎱 로또 번호 분석기 <span style="font-size:12px;color:#818CF8;font-weight:800;vertical-align:middle">v4</span></h1>
  <p>제 <strong style="color:#FBBF24" id="h-next">…</strong>회 추천 &nbsp;·&nbsp; 전체 <strong style="color:#C084FC" id="h-total">…</strong>회</p>
  <div id="acct" style="margin-top:8px"></div>
</div>
<div id="tab-nav"></div>
<div id="content"><div style="text-align:center;padding:40px;color:#6B7A9E">불러오는 중...</div></div>

<!-- 로그인 모달 -->
<div id="auth-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,10,.75);z-index:50;padding:20px;overflow-y:auto">
  <div style="max-width:360px;margin:60px auto;background:#0d0d28;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="auth-title" style="font-size:16px;font-weight:800;color:#E8ECFF">로그인</div>
      <button onclick="closeAuth()" style="background:none;border:none;color:#6B7A9E;font-size:20px;padding:4px 8px">✕</button>
    </div>
    <input id="auth-email" type="email" placeholder="이메일" autocomplete="email" style="width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#E8ECFF;font-size:14px;margin-bottom:9px">
    <input id="auth-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#E8ECFF;font-size:14px;margin-bottom:12px">
    <label style="display:flex;align-items:center;gap:7px;font-size:11px;color:#7080A0;margin-bottom:8px"><input type="checkbox" id="auth-remember" checked style="width:16px;height:16px;accent-color:#2563EB"> 이메일 저장</label>
    <div id="auth-msg" style="font-size:11px;color:#F87171;min-height:16px;margin-bottom:8px"></div>
    <button id="auth-submit" onclick="doAuth()" style="width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;font-weight:700;font-size:14px;margin-bottom:9px">로그인</button>
    <button onclick="toggleAuthMode()" id="auth-toggle" style="width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:none;color:#7080A0;font-size:12px;margin-bottom:14px">처음이신가요? 회원가입</button>
    <button onclick="doRecover()" style="width:100%;padding:8px;background:none;border:none;color:#5A6A8E;font-size:11px;text-decoration:underline">비밀번호를 잊으셨나요?</button>
  </div>
</div>

<script>
// ── v4.1: 서버 분리 클라이언트 + 출석 레벨 시스템 (알고리즘 없음) ──
function showErr(msg){
  var b=document.getElementById('err-banner');
  if(b){b.style.display='block';b.innerHTML='<b>오류:</b><br>'+msg;}
}
window.onerror=function(m,u,l){showErr(m+' (줄:'+l+')');return true;};

var SB_URL='https://gdckvqbolfwtrydeervz.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkY2t2cWJvbGZ3dHJ5ZGVlcnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTgzNzIsImV4cCI6MjEwMjk3NDM3Mn0.UDNfuKVhXI-kGQVt3Z1_Rcy7ewW1oGkKLO7_aJwOMR8';
var sb=window.supabase.createClient(SB_URL,SB_ANON);

var LEVELS=[
  {lv:0,name:'게스트',c:'#6B7A9E',desc:'순수 랜덤 번호만',cond:'-'},
  {lv:1,name:'회원',c:'#38BDF8',desc:'기본 필터 + 5개일치 회피 · 빈도/기록 열람',cond:'가입 즉시'},
  {lv:2,name:'실버',c:'#C0C8D8',desc:'+ 독식지수(인기 회피) · 핫&콜드 열람',cond:'연속 출석 3일'},
  {lv:3,name:'골드',c:'#FBBF24',desc:'+ 세트 구조 전략(분산/집중) · 프리미엄 정보',cond:'실버에서 연속 6일 더'}
];
var MASTER={lv:100,name:'마스터',c:'#F472B6',desc:'운영자',cond:'-'};
var TESTER={lv:99,name:'테스터',c:'#4ADE80',desc:'테스트 계정',cond:'-'};
function lvInfo(lv){if(lv===100)return MASTER;if(lv===99)return TESTER;return LEVELS[Math.max(0,Math.min(3,lv))];}
function effLv(){return(state.level===100||state.level===99)?3:state.level;}

var TABS=[
  {id:'rec',label:'🎯 추천',min:0},
  {id:'freq',label:'📊 빈도',min:1},
  {id:'hist',label:'📋 기록',min:1},
  {id:'hot',label:'🔥 핫&콜드',min:2},
  {id:'prem',label:'🔮 프리미엄',min:3},
  {id:'adm',label:'🛠 관리',min:100},
  {id:'me',label:'👤 내정보',min:0}
];

var ZONES=[
  {lo:1,hi:10,c:"#FBBF24",tc:"#1A1000"},{lo:11,hi:20,c:"#38BDF8",tc:"#001525"},
  {lo:21,hi:30,c:"#F87171",tc:"#200000"},{lo:31,hi:40,c:"#C084FC",tc:"#120025"},
  {lo:41,hi:45,c:"#4ADE80",tc:"#001A00"}
];
var SETC=["#FBBF24","#4ADE80","#38BDF8","#F87171","#C084FC"];
var SETL=["A","B","C","D","E"];

var state={session:null,level:0,streak:0,toNext:null,notice:'',mode:'wide',rec:null,recBusy:false,draws:null,tab:'rec',authMode:'login',providers:{google:false,kakao:false},admin:null,admBusy:false,recovery:false};

function gz(n){for(var i=0;i<5;i++)if(n>=ZONES[i].lo&&n<=ZONES[i].hi)return ZONES[i];return ZONES[0];}
function ballHTML(n,size,glow,delay){
  var z=gz(n);
  var sh=glow?'0 0 14px '+z.c+'BB,0 3px 10px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.5)':'0 3px 10px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.45)';
  return '<div class="ball ap" style="width:'+size+'px;height:'+size+'px;background:radial-gradient(circle at 37% 32%,'+z.c+'FF 0%,'+z.c+'CC 55%,'+z.c+'99 100%);color:'+z.tc+';font-size:'+Math.round(size*.33)+'px;box-shadow:'+sh+';animation-delay:'+delay+'ms">'+n+'</div>';
}
function rdate(r){var d=new Date(1039264200000+(r-1)*7*864e5);return d.getFullYear()+'.'+(''+(d.getMonth()+1)).padStart(2,'0')+'.'+(''+d.getDate()).padStart(2,'0');}
function fmtNum(x){return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

// ── 상단 계정/탭 ──
function renderAcct(){
  var el=document.getElementById('acct');if(!el)return;
  if(state.session){
    var li=lvInfo(state.level);
    var streakStr=state.streak>0?'<span style="font-size:10px;color:#F97316;margin-right:6px">🔥 '+state.streak+'일</span>':'';
    el.innerHTML='<span style="font-size:11px;color:#9AA6C8">'+(state.session.user.email||'')+'</span> <span style="font-size:10px;font-weight:800;color:'+li.c+';background:'+li.c+'22;border:1px solid '+li.c+'55;padding:2px 9px;border-radius:9px;margin:0 6px">Lv.'+(state.level===100?'M':state.level===99?'T':state.level)+' '+li.name+'</span>'+streakStr+'<button onclick="doLogout()" style="font-size:10px;color:#6B7A9E;background:none;border:1px solid rgba(255,255,255,.15);padding:3px 10px;border-radius:9px">로그아웃</button>';
  }else{
    el.innerHTML='<span style="font-size:10px;font-weight:800;color:#6B7A9E;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:2px 9px;border-radius:9px;margin-right:6px">게스트</span><button onclick="openAuth()" style="font-size:11px;font-weight:700;color:#38BDF8;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);padding:4px 14px;border-radius:9px">로그인</button>';
  }
}
function renderTabs(){
  var nav=document.getElementById('tab-nav');if(!nav)return;
  var html='';
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    if(t.min===100&&state.level!==100)continue; // 관리 탭은 마스터에게만 노출
    var locked=state.level===100?false:(effLv()<t.min);
    html+='<button class="tb'+(state.tab===t.id?' on':'')+'" onclick="doTab(\''+t.id+'\')" data-t="'+t.id+'" style="'+(locked?'opacity:.45':'')+'">'+(locked?'🔒 ':'')+t.label+'</button>';
  }
  nav.innerHTML=html;
}

// ── 추천 탭 ──
function renderRec(){
  var li=lvInfo(state.level);
  var html='';
  if(state.notice){
    html+='<div class="card" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)"><div style="font-size:13px;font-weight:700;color:#FBBF24;text-align:center">'+state.notice+'</div></div>';
  }
  var rows='';
  for(var i=0;i<LEVELS.length;i++){
    var L=LEVELS[i],mine=L.lv===state.level||((state.level===100||state.level===99)&&L.lv===3),locked=effLv()<L.lv;
    rows+='<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:11px;margin-bottom:5px;background:'+(mine?L.c+'14':'rgba(255,255,255,.02)')+';border:1px solid '+(mine?L.c+'55':'rgba(255,255,255,.05)')+'">'
      +'<span style="flex-shrink:0;font-size:10px;font-weight:800;color:'+(locked?'#4A5570':L.c)+';min-width:52px">'+(mine?'▶ ':'')+'Lv.'+L.lv+' '+L.name+'</span>'
      +'<span style="font-size:10px;color:'+(locked?'#4A5570':'#9AA6C8')+';line-height:1.5;flex:1">'+(locked?'🔒 ':'')+L.desc+'</span>'
      +'<span style="flex-shrink:0;font-size:9px;color:'+(locked?'#5A6A8E':'#4ADE80')+'">'+L.cond+'</span></div>';
  }
  var prog='';
  if(state.session&&state.level>=1&&state.level<=2&&state.toNext!==null){
    var need=state.level===1?3:6,done=need-state.toNext;
    var pct=Math.round(done/need*100);
    prog='<div style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-size:10px;color:#7080A0;margin-bottom:4px"><span>🔥 연속 출석 '+state.streak+'일</span><span>'+lvInfo(state.level+1).name+'까지 '+state.toNext+'일</span></div><div style="background:rgba(255,255,255,.08);border-radius:6px;height:7px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#F97316,#FBBF24);border-radius:6px"></div></div></div>';
  }
  html+='<div class="card"><div class="ttl">🏅 내 레벨: <span style="color:'+li.c+'">'+(state.level===100?'👑 마스터':state.level===99?'🧪 테스터':'Lv.'+state.level+' '+li.name)+'</span></div>'+rows+prog
    +(state.level===0?'<div style="font-size:11px;color:#38BDF8;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:10px;padding:9px 12px;margin-top:8px">💡 무료 가입 시 분석 알고리즘 + 매일 접속만 해도 자동 승급됩니다 → <b onclick="openAuth()" style="text-decoration:underline;cursor:pointer">로그인/가입</b></div>':'')
    +'</div>';
  if(effLv()>=3){
    var wOn=state.mode==='wide';
    var bw='flex:1;padding:11px 6px;border-radius:12px;font-size:12px;font-weight:700;min-height:52px;';
    html+='<div class="card"><div class="ttl">🧭 세트 구조 전략</div><div style="display:flex;gap:8px">'
      +'<button onclick="setMode(1)" style="'+bw+'border:1.5px solid '+(wOn?'#38BDF8':'rgba(255,255,255,.12)')+';background:'+(wOn?'rgba(56,189,248,.13)':'rgba(255,255,255,.03)')+';color:'+(wOn?'#38BDF8':'#6B7A9E')+'">🌐 분산<br><span style="font-size:9px;font-weight:400">30개 완전 분리 · 3개+ 11.9%</span></button>'
      +'<button onclick="setMode(0)" style="'+bw+'border:1.5px solid '+(!wOn?'#C084FC':'rgba(255,255,255,.12)')+';background:'+(!wOn?'rgba(192,132,252,.13)':'rgba(255,255,255,.03)')+';color:'+(!wOn?'#C084FC':'#6B7A9E')+'">🎯 집중<br><span style="font-size:9px;font-weight:400">핵심 3개 공유 · 동반 적중형</span></button></div></div>';
  }
  if(state.recBusy){
    html+='<div class="card" style="text-align:center"><div class="ttl">서버에서 생성 중...</div><div style="background:rgba(255,255,255,.08);border-radius:8px;height:6px;overflow:hidden;margin:12px 0"><div style="width:55%;height:100%;background:linear-gradient(90deg,#0EA5E9,#6366F1);animation:shimmer 1.4s linear infinite"></div></div></div>';
  }else if(state.rec){
    var r=state.rec,setsHTML='';
    for(var idx=0;idx<r.sets.length;idx++){
      var s=r.sets[idx],bls='';
      for(var i=0;i<s.nums.length;i++)bls+=ballHTML(s.nums[i],36,true,(idx*6+i)*40);
      var tags='<span class="tag" style="color:#4ADE80;background:rgba(74,222,128,.1)">짝 '+s.meta.even+'</span><span class="tag" style="color:#F87171;background:rgba(248,113,113,.1)">홀 '+(6-s.meta.even)+'</span>';
      if(typeof s.meta.unpop!=='undefined'){
        var upC=s.meta.unpop>=80?'#4ADE80':s.meta.unpop>=60?'#FBBF24':'#F87171';
        tags+='<span class="tag" style="color:'+upC+';background:rgba(255,255,255,.06)">독식 '+s.meta.unpop+'</span>';
        tags+='<span class="tag" style="color:#818CF8;background:rgba(129,140,248,.1)">시너지 '+s.meta.synergy+'</span>';
      }
      if(s.meta.freshness){
        var fL=s.meta.freshness==='fresh'?'신선 ✓':s.meta.freshness==='overlap4'?'4개 겹침':'⚠ 유사';
        var fC=s.meta.freshness==='fresh'?'#4ADE80':s.meta.freshness==='overlap4'?'#FBBF24':'#F87171';
        tags+='<span class="tag" style="color:'+fC+';background:rgba(255,255,255,.06)">'+fL+'</span>';
      }
      setsHTML+='<div style="background:rgba(255,255,255,.028);border-radius:14px;border:1px solid '+SETC[idx]+'22;padding:11px 10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:7px"><div style="width:22px;height:22px;border-radius:50%;flex-shrink:0;background:'+SETC[idx]+'18;border:1.5px solid '+SETC[idx]+'66;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:'+SETC[idx]+'">'+SETL[idx]+'</div><div style="display:flex;gap:4px;flex:1;flex-wrap:wrap">'+bls+'</div><div style="flex-shrink:0;text-align:right"><div class="rj" style="font-size:13px;color:'+SETC[idx]+'">'+s.meta.sum+'</div><div style="font-size:8px;color:#5A6A8E">합계</div></div></div><div class="set-tags">'+tags+'</div></div>';
    }
    html+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="ttl" style="margin-bottom:0">🎯 제 '+r.nextRound+'회 추천 5세트</div><button onclick="getRec()" style="padding:6px 11px;border-radius:12px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.08);color:#FBBF24;font-size:11px;font-weight:600">🔄 재생성</button></div><div style="font-size:10px;color:#5A6A8E;margin-bottom:12px">적용: '+r.algo+'</div>'+setsHTML+'</div>';
  }else{

// ── 데이터 (공개 통계) ──
function loadDraws(cb){
  if(state.draws){cb();return;}
  var all=[];
  function page(from){
    sb.from('draws').select('round,n1,n2,n3,n4,n5,n6,bonus,drawn_date').order('round',{ascending:false}).range(from,from+999)
      .then(function(res){
        if(res.error){showErr('데이터 조회 실패: '+res.error.message);return;}
        all=all.concat(res.data||[]);
        if(res.data&&res.data.length===1000)page(from+1000);
        else{
          state.draws=all;
          var eT=document.getElementById('h-total');
          if(eT&&all.length)eT.textContent=fmtNum(all.length);
          cb();
        }
      });
  }
  page(0);
}
function drawNums(d){return[d.n1,d.n2,d.n3,d.n4,d.n5,d.n6];}
function needDraws(id){
  return '<div class="card" style="text-align:center;color:#6B7A9E;padding:30px">데이터 로딩 중...</div>';
}

function renderFreq(){
  if(!state.draws)return needDraws('freq');
  var freq={};for(var n=1;n<=45;n++)freq[n]=0;
  for(var i=0;i<state.draws.length;i++){var nn=drawNums(state.draws[i]);for(var j=0;j<6;j++)freq[nn[j]]++;}
  var mx=0;for(var n=1;n<=45;n++)if(freq[n]>mx)mx=freq[n];
  var bars='';for(var n=1;n<=45;n++){var z=gz(n),h=Math.round(freq[n]/mx*110);bars+='<div class="fb" style="height:'+h+'px;background:'+z.c+'"></div>';}
  var sorted=[];for(var n=1;n<=45;n++)sorted.push([n,freq[n]]);
  sorted.sort(function(a,b){return b[1]-a[1];});
  var t10='';for(var i=0;i<10;i++)t10+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><span style="font-size:8px;color:#5A6A8E;width:11px">'+(i+1)+'</span>'+ballHTML(sorted[i][0],22,false,0)+'<span style="font-size:11px;color:#C4CCEE">'+sorted[i][1]+'회</span></div>';
  sorted.sort(function(a,b){return a[1]-b[1];});
  var b10='';for(var i=0;i<10;i++)b10+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><span style="font-size:8px;color:#5A6A8E;width:11px">'+(i+1)+'</span>'+ballHTML(sorted[i][0],22,false,0)+'<span style="font-size:11px;color:#C4CCEE">'+sorted[i][1]+'회</span></div>';
  return '<div class="card"><div class="ttl">전체 출현 빈도 ('+state.draws.length+'회)</div><div class="freq-bars">'+bars+'</div><div style="display:flex;justify-content:space-between;font-size:8px;color:#5A6A8E;margin:2px 0 16px"><span>1</span><span>10</span><span>20</span><span>30</span><span>40</span><span>45</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div style="font-size:11px;color:#F87171;font-weight:700;margin-bottom:8px">🔴 많이 나온 TOP 10</div>'+t10+'</div><div><div style="font-size:11px;color:#38BDF8;font-weight:700;margin-bottom:8px">🔵 적게 나온 TOP 10</div>'+b10+'</div></div></div>';
}

function renderHist(){
  if(!state.draws)return needDraws('hist');

    var d=state.draws[i],nn=drawNums(d),balls='';

  }

function renderHot(){
  if(!state.draws)return needDraws('hot');
  var N=state.draws.length,rF={},ls={},sums=[],evenTot=0;
  for(var n=1;n<=45;n++){rF[n]=0;ls[n]=N;}
  for(var i=0;i<N;i++){
    var nn=drawNums(state.draws[i]),sum=0;
    for(var j=0;j<6;j++){
      var n=nn[j];sum+=n;if(n%2===0)evenTot++;
      if(i<10)rF[n]++;
      if(ls[n]===N)ls[n]=i;
    }
    sums.push(sum);
  }
  var avgEven=evenTot/N,avgSum=0;for(var i=0;i<N;i++)avgSum+=sums[i];avgSum/=N;
  var hot='',hs=[];
  for(var n=1;n<=45;n++)if(rF[n]>=2)hs.push([n,rF[n]]);
  hs.sort(function(a,b){return b[1]-a[1];});
  for(var i=0;i<hs.length;i++)hot+='<div style="text-align:center">'+ballHTML(hs[i][0],38,true,0)+'<div style="font-size:9px;color:#F97316;margin-top:3px;font-weight:700">'+hs[i][1]+'회</div></div>';
  if(!hot)hot='<div style="font-size:11px;color:#5A6A8E">해당 없음</div>';
  var cold='',lsS=[];
  for(var n=1;n<=45;n++)lsS.push([n,ls[n]]);
  lsS.sort(function(a,b){return b[1]-a[1];});
  for(var i=0;i<15;i++)cold+='<div style="text-align:center">'+ballHTML(lsS[i][0],36,false,0)+'<div style="font-size:9px;color:#38BDF8;margin-top:3px">'+lsS[i][1]+'회전</div></div>';
  var mn=Math.min.apply(null,sums),mxs=Math.max.apply(null,sums);
  return '<div class="card"><div class="ttl" style="color:#F97316">🔥 최근 10회 핫넘버</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+hot+'</div></div>'
    +'<div class="card"><div class="ttl" style="color:#38BDF8">🧊 장기 미출현 콜드넘버</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+cold+'</div></div>'
    +'<div class="card"><div class="ttl">홀짝 · 합계 분포</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px"><div style="background:rgba(255,255,255,.04);border-radius:11px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06)"><div class="sv rj" style="color:#38BDF8">'+avgEven.toFixed(1)+'</div><div class="sl">짝수 평균</div></div><div style="background:rgba(255,255,255,.04);border-radius:11px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06)"><div class="sv rj" style="color:#F87171">'+(6-avgEven).toFixed(1)+'</div><div class="sl">홀수 평균</div></div><div style="background:rgba(255,255,255,.04);border-radius:11px;padding:9px 5px;text-align:center;border:1px solid rgba(255,255,255,.06)"><div class="sv rj" style="color:#FBBF24">'+Math.round(avgSum)+'</div><div class="sl">합계 평균</div></div></div><div style="font-size:10px;color:#5A6A8E;text-align:center">합계 범위: '+mn+' ~ '+mxs+'</div></div>';
}

function authErrKo(m){
  if(!m)return '오류가 발생했습니다.';
  if(m.indexOf('Invalid login credentials')>=0)return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if(m.indexOf('already registered')>=0)return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if(m.indexOf('at least 6')>=0)return '비밀번호는 6자 이상이어야 합니다.';
  if(m.indexOf('valid email')>=0||m.indexOf('invalid format')>=0)return '올바른 이메일 주소를 입력해 주세요.';
  if(m.indexOf('rate limit')>=0||m.indexOf('Too many')>=0)return '시도가 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
  return m;
}
function doAuth(){
  var email=document.getElementById('auth-email').value.trim();
  var pw=document.getElementById('auth-pw').value;
  var msg=document.getElementById('auth-msg');
  if(!email||pw.length<6){msg.textContent='이메일과 6자 이상 비밀번호를 입력하세요.';return;}
  msg.style.color='#7080A0';msg.textContent='처리 중...';
  var p=state.authMode==='login'?sb.auth.signInWithPassword({email:email,password:pw}):sb.auth.signUp({email:email,password:pw});
  p.then(function(res){
    if(res.error){msg.style.color='#F87171';msg.textContent=authErrKo(res.error.message);return;}
    try{
      var rm=document.getElementById('auth-remember');
      if(rm&&rm.checked)localStorage.setItem('lotto-last-email',email);
      else localStorage.removeItem('lotto-last-email');
    }catch(e){}
    closeAuth();
  });
}
function doRecover(){
  var email=document.getElementById('auth-email').value.trim();
  var msg=document.getElementById('auth-msg');
  if(!email){msg.style.color='#FBBF24';msg.textContent='가입한 이메일을 입력한 뒤 다시 눌러주세요.';return;}
  msg.style.color='#7080A0';msg.textContent='재설정 메일 발송 중...';
  sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname})
    .then(function(res){
      if(res.error){msg.style.color='#F87171';msg.textContent=authErrKo(res.error.message);return;}
      msg.style.color='#4ADE80';msg.textContent='재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인하세요.';
    });
}
function setNewPw(){
  var pw=document.getElementById('new-pw').value;
  var msg=document.getElementById('new-pw-msg');
  if(pw.length<6){if(msg)msg.textContent='6자 이상 입력하세요.';return;}
  sb.auth.updateUser({password:pw}).then(function(res){
    if(res.error){if(msg)msg.textContent=authErrKo(res.error.message);return;}
    state.recovery=false;state.notice='✅ 비밀번호가 변경되었습니다. 다음부터 이메일+비밀번호로 로그인하세요.';
    doTab('rec');
  });
}
function doOAuth(provider){
  var msg=document.getElementById('auth-msg');
  if(!state.providers[provider]){
    if(msg){msg.style.color='#FBBF24';msg.textContent=(provider==='google'?'구글':'카카오')+' 로그인은 준비 중입니다. 이메일로 가입해 주세요.';}
    return;
  }
  sb.auth.signInWithOAuth({provider:provider,options:{redirectTo:window.location.origin+window.location.pathname}})
    .then(function(res){
      if(res.error&&msg){msg.style.color='#F87171';msg.textContent='소셜 로그인 실패: '+res.error.message;}
    });
}
function doLogout(){sb.auth.signOut();state.rec=null;state.admin=null;state.notice='';state.streak=0;state.toNext=null;}

function loadProfile(cb){
  if(!state.session){state.level=0;state.streak=0;state.toNext=null;cb();return;}
  sb.from('profiles').select('level,streak').eq('id',state.session.user.id).single()
    .then(function(res){
      if(res.data){state.level=typeof res.data.level==='number'?res.data.level:1;state.streak=res.data.streak||0;}
      else state.level=1;
      cb();
    });
}
function doCheckin(){
  if(!state.session)return;
  fetch(SB_URL+'/functions/v1/checkin',{method:'POST',headers:{'Authorization':'Bearer '+state.session.access_token}})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&typeof j.level==='number'){
        state.level=j.level;state.streak=j.streak;state.toNext=j.toNext;
        if(j.leveledUp)state.notice='🎉 레벨 업! '+(j.level===100?'마스터':'Lv.'+j.level+' '+lvInfo(j.level).name)+' 달성!';
        else if(j.leveledDown)state.notice='😢 연속 출석이 끊겨 Lv.'+j.level+' '+lvInfo(j.level).name+'(으)로 조정됐어요. 다시 시작!';
        renderAcct();doTab(state.tab);
      }
    })
    .catch(function(e){});
}

// ── 부트스트랩 ──
function refresh(){renderAcct();renderTabs();doTab(state.tab);}
sb.auth.onAuthStateChange(function(ev,session){
  if(ev==='PASSWORD_RECOVERY')state.recovery=true;
  state.session=session;state.rec=null;state.mode='wide';state.admin=null;
  loadProfile(function(){refresh();if(session)doCheckin();});
});
fetch(SB_URL+'/auth/v1/settings',{headers:{apikey:SB_ANON}})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j&&j.external){state.providers.google=!!j.external.google;state.providers.kakao=!!j.external.kakao;}
    syncOAuthButtons();
  }).catch(function(e){});
try{
  if(window.location.hash&&window.location.hash.indexOf('error')>=0){
    var _hm=window.location.hash.match(/error_description=([^&]+)/);
    openAuth();
    var _am=document.getElementById('auth-msg');
    if(_am){_am.style.color='#F87171';_am.textContent='소셜 로그인 실패: '+(_hm?decodeURIComponent(_hm[1].replace(/\+/g,' ')):'설정을 확인해 주세요');}
    history.replaceState(null,'',window.location.pathname);
  }
}catch(e){}
sb.auth.getSession().then(function(res){
  state.session=res.data?res.data.session:null;
  loadProfile(function(){
    refresh();
    if(state.session)doCheckin();
    var exp=Math.floor((Date.now()-1039264200000)/604800000)+1;
    var eN=document.getElementById('h-next');if(eN)eN.textContent=exp+1;
    loadDraws(function(){
      var eN2=document.getElementById('h-next');
      if(eN2&&state.draws&&state.draws.length){
        var latest=state.draws[0].round;
        eN2.textContent=(exp>latest?exp:latest)+1;
      }
      if(state.tab==='freq'||state.tab==='hist'||state.tab==='hot')doTab(state.tab);
    });
  });
});
</script>

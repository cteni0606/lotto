name: 로또 데이터 자동 업데이트

on:
  schedule:
    - cron: '45 12 * * 6'   # 매주 토요일 21:45 KST (추첨 직후)
    - cron: '0 0 * * 0'     # 일요일 09:00 KST 백업 재시도
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lotto

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 신규 회차 수집
        run: node scripts/update-lotto.js
      - name: 변경 시 커밋
        run: |
          if ! git diff --quiet lotto-update.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lotto-update.json
            git commit -m "데이터 자동 업데이트 ($(date -u -d '+9 hours' +%Y-%m-%d))"
            git push
          else
            echo "변경 없음"
          fi
